# Build → deploy wiring for one CI-built app: Flux image automation, flux-sync RBAC, Tekton Trigger.
# An app includes it with `components: [../../components/ci-app]` in its kustomization.yaml, and its
# Flux Kustomization (clusters/production/apps/<app>.yaml) fills in, via postBuild.substitute:
#   ci_project  GitHub repository under dnnnvx = registry project = app name (app-<name>, apps/<name>)
#   ci_image    image name: registry.local.casasulgorgo.net/<ci_project>/<ci_image>, built from the
#               flake's packages.<system>.image at the repository root
# One image per app. For more, add an ImageRepository/ImagePolicy pair per image in the app itself, its
# name to this Role's resourceNames, and a <name>,<attr>,<flakedir> entry to the `images` binding.
# Write no other dollar-brace expressions here: Flux would substitute (or blank) them.
---
# Lives in flux-system: ImageUpdateAutomation only sees policies in its own namespace.
# Tekton moves the `production` tag on every main build; Flux follows its digest and
# pins it in kustomization.yaml, so each rollout is a git commit.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: ${ci_project}-${ci_image}
  namespace: flux-system
spec:
  image: registry.local.casasulgorgo.net/${ci_project}/${ci_image}
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: ${ci_project}-${ci_image}
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: ${ci_project}-${ci_image}
  filterTags:
    pattern: '^production$'
  policy:
    alphabetical:
      order: asc
  # The tag is mutable: re-check its digest on every interval
  digestReflectionPolicy: Always
  interval: 5m
---
# What the flux-sync task may touch after a build. Scoped by name: patch on a
# Kustomization/GitRepository would otherwise let the CI namespace rewrite arbitrary Flux objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-sync-${ci_project}
  namespace: flux-system
rules:
  - apiGroups: [image.toolkit.fluxcd.io]
    resources: [imagerepositories, imagepolicies]
    resourceNames:
      - ${ci_project}-${ci_image}
    verbs: [get, patch]
  - apiGroups: [image.toolkit.fluxcd.io]
    resources: [imageupdateautomations]
    resourceNames: [apps]
    verbs: [get, patch]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    resourceNames:
      - app-${ci_project}
    verbs: [get, patch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    resourceNames: [flux-system]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-sync-${ci_project}
  namespace: flux-system
subjects:
  - kind: ServiceAccount
    name: flux-sync
    namespace: tekton-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-sync-${ci_project}
---
# The revision comes from the payload, trusted once the github interceptor has verified its HMAC
# signature (X-Hub-Signature-256). The clone URL is pinned (the Kyverno provenance check allowlists it).
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: ${ci_project}
  namespace: tekton-ci
  labels:
    ci.casasulgorgo.net/eventlistener: github
spec:
  interceptors:
    - name: verify-signature
      ref:
        name: github
        kind: ClusterInterceptor
      params:
        - name: secretRef
          value:
            secretName: github-webhook
            secretKey: secret
        - name: eventTypes
          value: ["push"]
    - name: filter
      ref:
        name: cel
        kind: ClusterInterceptor
      params:
        - name: filter
          value: >-
            body.repository.full_name == 'dnnnvx/${ci_project}' &&
            body.ref == 'refs/heads/main' &&
            body.after.matches('^[0-9a-f]{40}$') &&
            body.after != '0000000000000000000000000000000000000000' &&
            !body.head_commit.message.contains('[skip ci]')
        - name: overlays
          value:
            - key: tags
              expression: "body.after + ' latest production'"
  bindings:
    - name: project
      value: ${ci_project}
    # Flake + nix2container (tasks/nix-build.yaml): space-separated <name>,<attr>,<flakedir> per image
    - name: images
      value: ${ci_image},image,.
    - name: flux-kustomization
      value: app-${ci_project}
    - name: repo-url
      value: https://github.com/dnnnvx/${ci_project}
    - name: revision
      value: $(body.after)
    - name: tags
      value: $(extensions.tags)
  template:
    ref: build-image
