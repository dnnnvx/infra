apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny
spec:
  endpointSelector:
    matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - kube-system
          - piraeus-datastore
          - cnpg-system
          - cert-manager
          - flux-system
          - default
  ingress: []
  egress: []
