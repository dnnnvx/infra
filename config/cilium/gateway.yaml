apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
  namespace: kube-system
  annotations:
    io.cilium/lb-ipam-ips: "192.168.0.200"
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-casasulgorgo-net
            kind: Secret
            namespace: kube-system
      allowedRoutes:
        namespaces:
          from: All
