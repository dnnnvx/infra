# CiliumEnvoyConfig injects Envoy xDS resources into the Gateway's Envoy proxy.
# This adds an ext_authz HTTP filter that runs before every request is routed —
# Envoy calls OAuth2 Proxy's /oauth2/auth endpoint first. If the response is 2xx
# the request proceeds to the backend unchanged. If 401/302, the response (with
# redirect headers from OAuth2 Proxy) is returned directly to the client, sending
# them to the Pocket-ID login page.
#
# This means HTTPRoutes don't need to know about auth at all — protection is applied
# at the Gateway level. To protect a new service, just expose it with an HTTPRoute;
# ext_authz covers it automatically. To leave a service unprotected, add its
# hostname to the skip_redirect_response_codes or use per-route disable annotations.
#
# OAuth2 Proxy skips its own /oauth2/* paths internally, so the login/callback
# flow at oauth.casasulgorgo.net is never caught in a redirect loop.
apiVersion: cilium.io/v2
kind: CiliumEnvoyConfig
metadata:
  name: gateway-ext-authz
  namespace: kube-system
spec:
  # Cilium creates a Service named cilium-gateway-<gateway-name> for each Gateway resource.
  # Listing it here scopes this Envoy config to the homelab Gateway's Envoy proxy.
  services:
    - name: cilium-gateway-homelab
      namespace: kube-system

  resources:
    # Envoy cluster definition for OAuth2 Proxy.
    # Envoy needs an explicit cluster entry to be able to call oauth2-proxy
    # from the ext_authz filter — it can't resolve Kubernetes DNS directly.
    - "@type": type.googleapis.com/envoy.config.cluster.v3.Cluster
      name: ext-authz-oauth2-proxy
      connect_timeout: 5s
      type: LOGICAL_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: ext-authz-oauth2-proxy
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: oauth2-proxy.webauth.svc.cluster.local
                      port_value: 4180

    # HTTP filter injected into the Gateway's HTTP connection manager.
    # ExtAuthz runs before the router filter, so auth is checked on every request
    # before Envoy decides which backend to send traffic to.
    - "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
      name: envoy.filters.http.ext_authz
      http_service:
        server_uri:
          uri: http://oauth2-proxy.webauth.svc.cluster.local:4180
          cluster: ext-authz-oauth2-proxy
          timeout: 5s
        # OAuth2 Proxy's forward-auth endpoint — returns 200 if session cookie is valid,
        # 302 (redirect to login) or 401 if not.
        path_prefix: /oauth2/auth
        authorization_request:
          # Forward these headers to OAuth2 Proxy so it can validate the session
          # cookie and know the original request's host/scheme.
          allowed_headers:
            patterns:
              - exact: cookie
              - exact: x-forwarded-for
              - exact: x-forwarded-host
              - exact: x-forwarded-proto
              - exact: x-forwarded-uri
        authorization_response:
          # If OAuth2 Proxy injects an Authorization header after validating the
          # token, pass it through to the upstream backend.
          allowed_upstream_headers:
            patterns:
              - exact: authorization
              - exact: x-auth-request-user
              - exact: x-auth-request-email
      # If OAuth2 Proxy is unreachable, deny the request rather than failing open.
      failure_mode_allow: false
