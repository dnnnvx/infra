apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: kube-system
  hostnames:
    - flux.home
  rules:
    - backendRefs:
        - name: flux-operator
          namespace: flux-system
          port: 9080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-operator-external
  namespace: flux-system
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: https
  hostnames:
    - flux.casasulgorgo.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hook/
      backendRefs:
        - name: notification-controller
          port: 80
    - backendRefs:
        - name: flux-operator
          port: 9080
