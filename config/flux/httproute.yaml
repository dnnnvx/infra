apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: kube-system
  hostnames:
    - flux.homelab
  rules:
    - backendRefs:
        - name: flux-operator
          namespace: flux-system
          port: 9080
