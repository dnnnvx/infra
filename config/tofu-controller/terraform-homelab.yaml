apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: homelab
  namespace: flux-system
spec:
  # Manual approval — plans run automatically, but apply requires explicit approval.
  # This is intentional: this config manages the cluster itself (Talos, Cilium, Flux).
  # Auto-apply could brick the cluster if something goes wrong.
  #
  # To approve a plan:
  #   kubectl -n flux-system patch terraform homelab \
  #     --type merge -p '{"spec":{"approvePlan":"plan-<id>"}}'
  approvePlan: ""
  interval: 30m
  path: ./tofu/homelab
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  backendConfig:
    customConfiguration: |
      backend "s3" {
        bucket                      = "tofu-state"
        key                         = "homelab/terraform.tfstate"
        region                      = "auto"
        endpoints                   = { s3 = "https://997f91bd76e7456df317ac9ac3fff92b.r2.cloudflarestorage.com" }
        skip_credentials_validation = true
        skip_metadata_api_check     = true
        skip_requesting_account_id  = true
        skip_region_validation      = true
        skip_s3_checksum            = true
        use_path_style              = true
      }
  backendConfigsFrom:
    - kind: Secret
      name: tofu-backend-credentials
      keys:
        - access_key
        - secret_key
  varsFrom:
    - kind: Secret
      name: tofu-homelab-vars
