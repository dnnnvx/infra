apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: pooler
  namespace: cnpg-system
spec:
  cluster:
    name: postgres # Must match your Cluster metadata.name
  instances: 1 # 2+ for high availability for the pooler itself
  type: rw # This pooler handles Read/Write traffic
  pgbouncer:
    poolMode: transaction # CRITICAL: This is the most memory-efficient mode
    parameters:
      max_client_conn: "1000" # Allow 1000 app connections
      default_pool_size: "20" # But only use 20 real Postgres connections
