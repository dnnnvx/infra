apiVersion: batch/v1
kind: Job
metadata:
  name: init-db
  namespace: cnpg-system
spec:
  ttlSecondsAfterFinished: 86400 # 24h
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-db
          image: alpine:3.21
          command:
            - sh
            - -c
            - apk add --no-cache gettext postgresql-client && envsubst < /sql/init.sql | psql -h postgres-rw -U postgres -d postgres
          envFrom:
            - secretRef:
                name: credentials
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: password
          volumeMounts:
            - name: sql
              mountPath: /sql
      volumes:
        - name: sql
          configMap:
            name: init-db
