---
apiVersion: v1
kind: Pod
metadata:
  name: pod-versioned-tag
  namespace: default
spec:
  containers:
    - name: app
      image: nginx:1.25.0
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-digest
  namespace: default
spec:
  containers:
    - name: app
      image: nginx@sha256:abc123def456
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-latest
  namespace: default
spec:
  containers:
    - name: app
      image: nginx:latest
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-edge
  namespace: default
spec:
  containers:
    - name: app
      image: nginx:edge
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-stable
  namespace: default
spec:
  containers:
    - name: app
      image: nginx:stable
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-dev
  namespace: default
spec:
  containers:
    - name: app
      image: nginx:dev
