apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-extra-mutable-tags
  annotations:
    policies.kyverno.io/title: Disallow Extra Mutable Image Tags
    policies.kyverno.io/description: >-
      Extends the upstream disallow-latest-tag policy to also reject other
      commonly used mutable tags: edge, stable, dev, master, main.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: disallow-extra-mutable-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
      validate:
        message: "Mutable image tags (edge, stable, dev, master, main) are not allowed."
        foreach:
          - list: "request.object.spec.[ephemeralContainers, initContainers, containers][]"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:edge"
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:stable"
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:dev"
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:master"
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:main"
