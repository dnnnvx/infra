apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: flux-sync
  namespace: tekton-ci
spec:
  description: >-
    Skips Flux's polling intervals after a build: waits until the ImagePolicy has
    resolved the pushed digest, makes ImageUpdateAutomation commit it, then
    reconciles the app's own Flux Kustomization and waits for its rollout.
    Needs the flux-sync ServiceAccount and the app's Role in flux-system.
  params:
    - name: image-policy
      type: string
      description: Name of the app's ImageRepository and ImagePolicy in flux-system.
    - name: kustomization
      type: string
      description: Name of the app's Flux Kustomization (wait - true) in flux-system.
    - name: digest
      type: string
      description: Digest the build just pushed, e.g. sha256:...
    - name: automation
      type: string
      default: apps
      description: ImageUpdateAutomation that commits the digest.
    - name: timeout
      type: string
      default: 7m
      description: How long to wait for the Kustomization to become ready.
  steps:
    - name: sync
      image: ghcr.io/fluxcd/flux-cli:v2.9.6
      env:
        - name: HOME
          value: /tmp
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      script: |
        #!/bin/sh
        set -eu
        ns=flux-system
        flux reconcile image repository "$(params.image-policy)" -n "$ns" --timeout=2m
        # The policy follows the repository scan asynchronously: wait for the pushed digest
        i=0
        until [ "$(kubectl -n "$ns" get imagepolicy "$(params.image-policy)" -o jsonpath='{.status.latestRef.digest}')" = "$(params.digest)" ]; do
          i=$((i + 1))
          if [ "$i" -gt 30 ]; then
            echo "ImagePolicy $(params.image-policy) never resolved $(params.digest)" >&2
            exit 1
          fi
          sleep 2
        done
        flux reconcile image update "$(params.automation)" -n "$ns" --timeout=2m
        flux reconcile kustomization "$(params.kustomization)" -n "$ns" --with-source --timeout="$(params.timeout)"
