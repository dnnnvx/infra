apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-image
  namespace: tekton-ci
spec:
  description: Clone a commit, build its images and push them to every requested tag, then sync Flux.
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
    - name: registry
      type: string
    - name: project
      type: string
    - name: images
      type: string
      description: Space-separated "name,dockerfile,context" entries (see the buildkit task).
    - name: tags
      type: string
      description: Space-separated tags, e.g. "<sha> latest production".
    - name: flux-kustomization
      type: string
      default: ""
      description: The app's Flux Kustomization to reconcile and wait for. Empty skips the Flux sync.
  workspaces:
    - name: source
  results:
    - name: commit
      value: $(tasks.clone.results.commit)
    - name: digests
      value: $(tasks.build.results.digests)
  tasks:
    - name: clone
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source
    - name: build
      runAfter:
        - clone
      taskRef:
        name: buildkit
      params:
        - name: registry
          value: $(params.registry)
        - name: project
          value: $(params.project)
        - name: images
          value: $(params.images)
        - name: tags
          value: $(params.tags)
      workspaces:
        - name: source
          workspace: source
    - name: deploy
      runAfter:
        - build
      when:
        - input: $(params.flux-kustomization)
          operator: notin
          values: [""]
      timeout: 12m
      taskRef:
        name: flux-sync
      params:
        - name: project
          value: $(params.project)
        - name: digests
          value: $(tasks.build.results.digests)
        - name: kustomization
          value: $(params.flux-kustomization)
