apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-image
  namespace: tekton-ci
spec:
  description: Clone a commit, build its Dockerfile and push it to every requested tag.
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
    - name: image
      type: string
      description: Image repository without tag, e.g. <registry>/casasulgorgo/web.
    - name: tags
      type: string
      description: Space-separated tags, e.g. "<sha> latest production".
    - name: cache-image
      type: string
    - name: dockerfile
      type: string
      default: Dockerfile
  workspaces:
    - name: source
  results:
    - name: commit
      value: $(tasks.clone.results.commit)
    - name: digest
      value: $(tasks.build.results.digest)
  tasks:
    - name: clone
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source
    - name: build
      runAfter:
        - clone
      taskRef:
        name: buildkit
      params:
        - name: image
          value: $(params.image)
        - name: tags
          value: $(params.tags)
        - name: cache-image
          value: $(params.cache-image)
        - name: dockerfile
          value: $(params.dockerfile)
      workspaces:
        - name: source
          workspace: source
