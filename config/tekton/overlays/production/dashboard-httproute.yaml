# Tekton Dashboard (read-only), LAN only like the other *.home services.
# Lives in tekton-pipelines so it can reference the Service without a ReferenceGrant.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tekton-dashboard
  namespace: tekton-pipelines
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: http
  hostnames:
    - tekton.home
  rules:
    - backendRefs:
        - name: tekton-dashboard
          port: 9097
