apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dragonfly
  namespace: dragonfly
spec:
  serviceName: dragonfly
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dragonfly
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dragonfly
    spec:
      containers:
        - name: dragonfly
          image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.37.0
          ports:
            - containerPort: 6379
              name: redis
          args:
            - --proactor_threads
            - "1"
            - --maxmemory
            - 256mb
            - --cluster_mode
            - emulated
            - --lock_on_hashtags
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: piraeus
        resources:
          requests:
            storage: 1Gi
