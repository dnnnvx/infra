apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netdata
  namespace: kube-system
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: http
  hostnames:
    - "netdata.home"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: netdata
          port: 19999
