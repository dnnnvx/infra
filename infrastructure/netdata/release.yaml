apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netdata
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: netdata
      version: "3.x"
      sourceRef:
        kind: HelmRepository
        name: netdata
        namespace: kube-system
      interval: 24h
  valuesFrom:
    - kind: ConfigMap
      name: netdata-values
      valuesKey: values.yaml
      optional: true
