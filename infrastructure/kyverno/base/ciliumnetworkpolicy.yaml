apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
  namespace: kyverno
spec:
  endpointSelector: {}
  ingress:
    # Webhook called by kube-apiserver
    - fromEntities:
        - kube-apiserver
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
    # Policy Reporter UI via Cilium Gateway
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Internal: Kyverno components + Policy Reporter communicate with each other
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kyverno
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    # Internal: Kyverno components + Policy Reporter communicate with each other
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kyverno
    # Policy Reporter → Telegram
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
