---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-flux-verify-images
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: kyverno-policies
    namespace: flux-system
  path: ./flux/verify-flux-images
  prune: true
  wait: false
  dependsOn:
    - name: infrastructure
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-flux-verify-git
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: kyverno-policies
    namespace: flux-system
  path: ./flux/verify-git-repositories
  prune: true
  wait: false
  dependsOn:
    - name: infrastructure
