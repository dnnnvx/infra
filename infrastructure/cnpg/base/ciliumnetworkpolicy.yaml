apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
  namespace: cnpg-system
spec:
  endpointSelector: {}
  ingress:
    # Internal: CNPG pods communicate for HA replication + operator webhooks
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-system
    # Operator webhook called by kube-apiserver
    # kube-apiserver runs with hostNetwork on the control plane node so it
    # appears as remote-node/host rather than the kube-apiserver entity
    - fromEntities:
        - kube-apiserver
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    # Internal: HA replication between CNPG pods
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-system
    # Backup to S3/R2 if configured
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # so list each app namespace that hosts a CNPG cluster here
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: bookorbit
        - matchLabels:
            io.kubernetes.pod.namespace: norish
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "5432"
              protocol: TCP
