apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
spec:
  install:
    createNamespace: true
  interval: 30m
  dependsOn:
    - name: cilium
      namespace: kube-system
  chart:
    spec:
      chart: cloudnative-pg
      version: ">=0.27.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: cnpg-system
      interval: 24h
  valuesFrom:
    - kind: ConfigMap
      name: cnpg-values
      valuesKey: values.yaml
      optional: true
