ui:
  enabled: true
  httproute:
    enabled: true
    parentRefs:
      - name: homelab
        namespace: kube-system
        sectionName: http
    hostnames:
      - kyverno.home
  plugins:
    kyverno: true

kyvernoPlugin:
  enabled: true

target:
  telegram:
    secretRef: policy-reporter-telegram
    minimumSeverity: "warning"
    skipExistingOnStartup: true
