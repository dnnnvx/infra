apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: policy-reporter
  namespace: kyverno
spec:
  interval: 30m
  dependsOn:
    - name: kyverno
      namespace: kyverno
  chart:
    spec:
      chart: policy-reporter
      version: 3.x
      sourceRef:
        kind: HelmRepository
        name: policy-reporter
        namespace: kyverno
      interval: 24h
  valuesFrom:
    - kind: ConfigMap
      name: policy-reporter-values
      valuesKey: values.yaml
      optional: true
