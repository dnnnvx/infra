kind: HelmRepository
metadata:
  name: cloudflared
  namespace: cloudflare
spec:
  interval: 24h
  url: https://charts.kubito.dev/
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
