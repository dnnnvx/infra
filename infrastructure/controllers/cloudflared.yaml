apiVersion: v1
kind: Namespace
metadata:
  name: cloudflare
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: cloudflared
  namespace: cloudflare
spec:
  interval: 24h
  url: https://charts.kubito.dev/
---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: cloudflare
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudflared
      version: '>=1.1.0'
      sourceRef:
        kind: HelmRepository
        name: cloudflared
        namespace: cloudflare
      interval: 24h
    values:
      image:
        repository: cloudflare/cloudflared
        tag: 2024.2.0
        imagePullPolicy: IfNotPresent
      replicaCount: 1
      managed:
        enabled: true
        existingSecret: cf-tunnel-token
---
