# Kyverno, admission controller only: enforces the ImageValidatingPolicy in
# infrastructure/configs/tekton/image-policy.yaml (our images must carry a Tekton Chains
# signature + SLSA provenance). Not sigstore policy-controller: it can't verify key-signed
# sigstore bundles, which is what Chains stores (storage.oci.encoding-format: sigstore-bundle).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  dependsOn:
    - name: cilium
      namespace: kube-system
  chart:
    spec:
      chart: kyverno
      version: 3.10.0
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: kyverno
      interval: 24h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: kyverno-values
      valuesKey: values.yaml
      optional: true
