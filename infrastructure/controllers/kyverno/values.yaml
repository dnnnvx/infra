# Only image verification at admission: no background scans, cleanup/generate
# policies or policy reports.
# The image policy's webhook fails closed for app namespaces: keep one replica up through
# node drains and reboots.
admissionController:
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
backgroundController:
  enabled: false
cleanupController:
  enabled: false
reportsController:
  enabled: false
features:
  admissionReports:
    enabled: false
  aggregateReports:
    enabled: false
  policyReports:
    enabled: false
  validatingAdmissionPolicyReports:
    enabled: false
  backgroundScan:
    enabled: false
  # ImageValidatingPolicies are enforced by Kyverno's own webhook
  generateValidatingAdmissionPolicy:
    enabled: false
  # zot allows anonymous reads; skip the cloud helpers probing metadata endpoints
  registryClient:
    credentialHelpers:
      - default
