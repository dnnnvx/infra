# Image verification only (ImageValidatingPolicies): no generate/mutate-existing or cleanup policies.
# The reports controller stays on: it rescans running pods (backgroundScan, hourly) and turns Audit
# results into PolicyReports (`kubectl get policyreports -A`).
# The Chains policy's webhook fails closed for app namespaces: keep one replica up through
# node drains and reboots.
admissionController:
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Cosign verification caches push it to ~350Mi at steady state
  container:
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 768Mi
# The background scan cosign-verifies every running image (like the admission controller, which
# sits at ~300Mi): the chart's 128Mi limit OOMKills it within a minute of each start.
reportsController:
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi
backgroundController:
  enabled: false
cleanupController:
  enabled: false
features:
  validatingAdmissionPolicyReports:
    enabled: false
  # ImageValidatingPolicies are enforced by Kyverno's own webhook
  generateValidatingAdmissionPolicy:
    enabled: false
  # zot allows anonymous reads and public registries need no login; skip the cloud
  # helpers probing metadata endpoints
  registryClient:
    credentialHelpers:
      - default
