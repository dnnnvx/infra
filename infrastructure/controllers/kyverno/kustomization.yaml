apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kyverno
resources:
  - namespace.yaml
  - ciliumnetworkpolicy.yaml
  - repository.yaml
  - release.yaml
configMapGenerator:
  - name: kyverno-values
    namespace: kyverno
    files:
      - values.yaml=values.yaml
    options:
      disableNameSuffixHash: true
