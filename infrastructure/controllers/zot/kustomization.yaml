apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zot
resources:
  - ciliumnetworkpolicy.yaml
  - namespace.yaml
  - repository.yaml
  - release.yaml
  - httproute.yaml
  - secrets.yaml
configMapGenerator:
  - name: zot-values
    namespace: zot
    files:
      - values.yaml=values.yaml
    options:
      disableNameSuffixHash: true
