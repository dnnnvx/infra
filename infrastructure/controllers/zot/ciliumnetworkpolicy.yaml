apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
  namespace: zot
spec:
  endpointSelector: {}
  ingress:
    # Only through the Gateways (httproute.yaml): registry.casasulgorgo.net (UI) and
    # registry.local.casasulgorgo.net from the LAN
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
    # In-cluster clients of registry.local.casasulgorgo.net keep their own identity through the Gateway's Envoy:
    # containerd on the nodes, Tekton pushes, Chains attaches signatures, Flux scans tags
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: tekton-ci
        - matchLabels:
            io.kubernetes.pod.namespace: tekton-chains
        - matchLabels:
            io.kubernetes.pod.namespace: flux-system
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # OIDC discovery + token exchange with Pocket-ID (auth.casasulgorgo.net)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
