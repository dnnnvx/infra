apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
  namespace: zot
spec:
  endpointSelector: {}
  ingress:
    # Only via the Gateways: registry.casasulgorgo.net (UI) and registry.local.casasulgorgo.net
    # (registry API for nodes, Tekton, Chains, Flux), see httproute.yaml
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # OIDC discovery + token exchange with Pocket-ID (auth.casasulgorgo.net)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
