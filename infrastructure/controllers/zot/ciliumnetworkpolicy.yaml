apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
  namespace: zot
spec:
  endpointSelector: {}
  ingress:
    # registry.casasulgorgo.net via the Gateway (UI only, see the HTTPRoute)
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
    # containerd on the nodes pulls via the pinned ClusterIP (Talos registry mirror)
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
    # In-cluster clients use the Service directly: Tekton pushes, Chains attaches signatures, Flux scans tags
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: tekton-ci
        - matchLabels:
            io.kubernetes.pod.namespace: tekton-chains
        - matchLabels:
            io.kubernetes.pod.namespace: flux-system
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # OIDC discovery + token exchange with Pocket-ID (auth.casasulgorgo.net)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
