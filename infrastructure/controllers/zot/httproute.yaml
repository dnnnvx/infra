# UI + registry API, LAN-only (nodes, Tekton, Chains, Flux, laptops). The UI logs in via Pocket-ID.
# TLS from the public *.local.casasulgorgo.net wildcard, so no client needs a private CA
# or an insecure/plain-HTTP flag. Pushes need credentials, reads are anonymous.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zot-local
  namespace: zot
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |
      name: Zot Registry
      group: infrastructure
spec:
  parentRefs:
    - name: homelab-local
      namespace: kube-system
      sectionName: https
  hostnames:
    - registry.local.casasulgorgo.net
  rules:
    - backendRefs:
        - name: zot
          port: 5000
