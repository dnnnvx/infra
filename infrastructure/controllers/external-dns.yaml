apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
    name: external-dns
    namespace: external-dns
spec:
    interval: 30m
    chart:
        spec:
            chart: external-dns
            version: '>=v1.14.3'
            sourceRef:
                kind: HelmRepository
                name: external-dns
                namespace: external-dns
            interval: 24h
    values:
        env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                    name: cf-api-token
                    key: CF_API_TOKEN
        resources: {}
        nodeSelector: {}
        affinity: {}
        topologySpreadConstraints: []
        tolerations: []
        serviceMonitor:
            enabled: false
        logLevel: info
        logFormat: text
        interval: 1m
        sources:
            - service
            - ingress
        policy: sync
        registry: txt
        txtOwnerId: ilposto-infra
        txtPrefix: null
        domainFilters:
            - ilposto.studio
            - olab.zone
        provider:
            name: cloudflare
        extraArgs: []
