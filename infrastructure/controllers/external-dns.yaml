apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/external-dns/
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: ">=v1.14.3"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: external-dns
      interval: 24h
  values:
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cf-api-token
            key: CF_API_TOKEN
    resources: {}
    nodeSelector: {}
    affinity: {}
    topologySpreadConstraints: []
    tolerations: []
    serviceMonitor:
      enabled: false
    logLevel: info
    logFormat: text
    interval: 1m
    sources:
      - service
      - ingress
    policy: sync
    registry: txt
    txtOwnerId: ilposto-infra
    txtPrefix:
    domainFilters:
      - ilposto.studio
      - olab.zone
    provider:
      name: cloudflare
    extraArgs: []
---
