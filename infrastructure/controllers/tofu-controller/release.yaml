apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
  namespace: flux-system
spec:
  interval: 30m
  dependsOn:
    - name: cilium
      namespace: kube-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: tofu-controller
      version: ">=0.16.5 <0.17.0"
      sourceRef:
        kind: HelmRepository
        name: tofu-controller
        namespace: flux-system
      interval: 24h
  valuesFrom:
    - kind: ConfigMap
      name: tofu-controller-values
      valuesKey: values.yaml
      optional: true
