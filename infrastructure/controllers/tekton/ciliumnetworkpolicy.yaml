# Controllers, webhooks and core interceptors (pipelines, triggers, pruner)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
  namespace: tekton-pipelines
spec:
  endpointSelector: {}
  ingress:
    # Admission/conversion webhooks called by kube-apiserver (hostNetwork, so
    # it shows up as host/remote-node — same as cnpg-system)
    - fromEntities:
        - kube-apiserver
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    # EventListeners call the core interceptors (8443) and the custom
    # tangled-interceptor (8080, infrastructure/configs/tekton/triggers/interceptor-tangled.yaml)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: tekton-ci
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    # tekton-events-controller → internal EventListener (CloudEvents, see patch-events.yaml)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: tekton-ci
            eventlistener: tekton-events
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The pipelines controller reads image configs from registries to resolve
    # step entrypoints when a step has no explicit command
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# Remote resolvers (git, hub, bundles, http) fetch Tasks/Pipelines from the internet
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
  namespace: tekton-pipelines-resolvers
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# Dashboard UI: reachable only through its oauth2-proxy (it can rerun/delete runs and has no
# auth of its own). Egress (DNS, kube-apiserver) is already covered by the namespace policy above.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dashboard
  namespace: tekton-pipelines
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: tekton-dashboard
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: tekton-dashboard-oauth2-proxy
      toPorts:
        - ports:
            - port: "9097"
              protocol: TCP
---
# Dashboard oauth2-proxy (infrastructure/configs/tekton/dashboard-oauth2-proxy.yaml): the Gateway
# entry point for tekton.local.casasulgorgo.net. DNS and world:443 (pocket-id at auth.casasulgorgo.net
# goes out through Cloudflare) are covered by the namespace policy above.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dashboard-oauth2-proxy
  namespace: tekton-pipelines
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tekton-dashboard-oauth2-proxy
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/part-of: tekton-dashboard
      toPorts:
        - ports:
            - port: "9097"
              protocol: TCP
---
# Chains: watches runs (kube-apiserver) and pushes signatures/attestations next to the images in zot
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
  namespace: tekton-chains
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    # zot via the LAN Gateway (registry.local.casasulgorgo.net)
    - toEntities:
        - ingress
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # In-cluster clients keep their identity through the Gateway's Envoy, which checks
    # this egress policy against the backend too
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: zot
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
