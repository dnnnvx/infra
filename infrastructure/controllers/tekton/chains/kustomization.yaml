# Separate level so the release's empty signing-secrets can be deleted before the parent adds
# the real one (../secrets-chains.yaml): kustomize rejects two resources with the same name.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/tektoncd/chains/releases/download/v0.29.0/release.yaml
patches:
  - path: patch-chains.yaml
