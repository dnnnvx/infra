apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager
resources:
  - ciliumnetworkpolicy.yaml
  - namespace.yaml
  - repository.yaml
  - release.yaml
configMapGenerator:
  - name: cert-manager-values
    namespace: cert-manager
    files:
      - values.yaml=values.yaml
    options:
      disableNameSuffixHash: true
