apiVersion: cilium.io/v2alpha1
kind: CiliumBGPPeeringPolicy
metadata:
  name: bgp-peering-policy
spec:
  virtualRouters:
    - localASN: 64512
      exportPodCIDR: false
      neighbors:
        - peerAddress: 192.168.1.1/32
          peerASN: 64512
      serviceSelector:
        matchExpressions:
          - key: usage
            operator: NotIn
            values:
              - internal
---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: lb-pool
spec:
  cidrs:
    - cidr: 172.198.1.0/24
