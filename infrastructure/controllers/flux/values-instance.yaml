instance:
  # Defaults plus image automation (scan zot for new tags, commit them back to git)
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
    - image-reflector-controller
    - image-automation-controller
  sync:
    interval: 30m
    kind: GitRepository
    url: "ssh://git@tangled.org/casasulgorgo.net/infra"
    ref: "refs/heads/main"
    path: ./clusters/production
    pullSecret: flux-system
  cluster:
    type: kubernetes
    multitenant: false
    networkPolicy: true
    domain: cluster.local
