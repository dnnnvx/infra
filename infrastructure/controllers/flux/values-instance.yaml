instance:
  # Defaults plus image automation (scan zot for new tags, commit them back to git)
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
    - image-reflector-controller
    - image-automation-controller
  sync:
    interval: 30m
    kind: GitRepository
    # Repo DID rather than handle: the handle path 404s after an account handle change
    url: "ssh://git@tangled.org/did:plc:mhpujlntihfhlixaayuearmr"
    ref: "refs/heads/main"
    path: ./clusters/production
    pullSecret: flux-system
  cluster:
    type: kubernetes
    multitenant: false
    networkPolicy: true
    domain: cluster.local
  # Same limit as clusters/production/revision-history.yaml (the operator deploys the controllers)
  kustomize:
    patches:
      - target:
          kind: Deployment
        patch: '[{"op": "add", "path": "/spec/revisionHistoryLimit", "value": 3}]'
