apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
    name: cilium
    namespace: kube-system
spec:
    interval: 30m
    chart:
        spec:
            chart: cilium
            version: 1.15.x
            sourceRef:
                kind: HelmRepository
                name: cilium
                namespace: kube-system
            interval: 24h
    values:
        ipam:
            mode: kubernetes
        hostFirewall:
            enabled: true
        hubble:
            relay:
                enabled: true
            ui:
                enabled: true
                service:
                    annotations:
                        external-dns.alpha.kubernetes.io/internal-hostname: hubble.ilposto.studio
        kubeProxyReplacement: disabled
        cgroup:
            autoMount:
                enabled: true
            hostRoot: /sys/fs/cgroup
        k8sServiceHost: 192.168.1.100
        k8sServicePort: "6443"
        # https://www.talos.dev/v1.6/learn-more/process-capabilities/
        securityContext:
            capabilities:
                ciliumAgent:
                    - CHOWN
                    - KILL
                    - NET_ADMIN
                    - NET_RAW
                    - IPC_LOCK
                    - SYS_ADMIN
                    - SYS_RESOURCE
                    - DAC_OVERRIDE
                    - FOWNER
                    - SETGID
                    - SETUID
                    - PERFMON
                    - BPF
                cleanCiliumState:
                    - NET_ADMIN
                    - SYS_ADMIN
                    - SYS_RESOURCE
                    - PERFMON
                    - BPF
sops:
    kms: []
    gcp_kms: []
    azure_kv: []
