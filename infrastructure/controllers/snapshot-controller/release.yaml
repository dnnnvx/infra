apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: snapshot-controller
      version: "5.4.0"
      sourceRef:
        kind: HelmRepository
        name: piraeus-charts
        namespace: kube-system
      interval: 24h
  valuesFrom:
    - kind: ConfigMap
      name: snapshot-controller-values
      valuesKey: values.yaml
      optional: true
