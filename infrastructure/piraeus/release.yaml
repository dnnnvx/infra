apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: piraeus-operator
  namespace: piraeus-datastore
spec:
  interval: 30m
  chart:
    spec:
      chart: piraeus-operator
      version: 2.10.x
      sourceRef:
        kind: HelmRepository
        name: piraeus
        namespace: piraeus-datastore
      interval: 24h
  valuesFrom:
    - kind: ConfigMap
      name: piraeus-values
      valuesKey: values.yaml
      optional: true
