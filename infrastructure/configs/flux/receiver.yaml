apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: github-push
  namespace: flux-system
spec:
  # Verifies X-Hub-Signature-256 with the token; the GitHub webhook's secret is the receiver-token value,
  # its URL https://<flux host> + .status.webhookPath (content type application/json)
  type: github
  events:
    - push
  secretRef:
    name: receiver-token
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: flux-system
