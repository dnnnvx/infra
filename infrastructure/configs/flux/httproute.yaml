apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  parentRefs:
    - name: homelab-local
      namespace: kube-system
      sectionName: https
  hostnames:
    - flux.local.casasulgorgo.net
  rules:
    - backendRefs:
        - name: flux-operator
          namespace: flux-system
          port: 9080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-operator-external
  namespace: flux-system
  annotations:
    gatus.home-operations.com/enabled: "true"
    # path "" — otherwise the sidecar probes the first match, /hook/ (404)
    gatus.home-operations.com/endpoint: |
      name: Flux Operator
      group: infrastructure
      path: ""
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: https
  hostnames:
    - flux.casasulgorgo.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hook/
      backendRefs:
        - name: webhook-receiver
          port: 80
    - backendRefs:
        - name: flux-operator
          port: 9080
