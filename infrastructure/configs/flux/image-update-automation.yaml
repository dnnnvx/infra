# Rewrites `# {"$imagepolicy": ...}` markers under ./apps when an ImagePolicy
# picks a newer tag, then pushes the commit to main. Needs push access with the
# flux-system SSH key.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        # GitHub noreply address of dnnnvx: the signing key's identity, so GitHub shows the commits as Verified
        email: 17187206+dnnnvx@users.noreply.github.com
      # OpenPGP key in signing-key.yaml (SOPS); its public half is registered on GitHub by tofu
      signingKey:
        secretRef:
          name: flux-signing-key
      # [skip ci]: a digest bump needs no validate-infra run (the Tekton Triggers skip such pushes)
      messageTemplate: |
        chore(images): update {{ range .Changed.Changes }}{{ .OldValue | trunc 15 }} → {{ .NewValue | trunc 15 }} {{ end }}[skip ci]
    push:
      branch: main
  update:
    path: ./apps
    strategy: Setters
