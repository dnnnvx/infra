# EventListener: read Triggers/bindings/templates, create PipelineRuns.
# Both ClusterRoles ship with Tekton Triggers.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-triggers
  namespace: tekton-ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-triggers-eventlistener
  namespace: tekton-ci
subjects:
  - kind: ServiceAccount
    name: tekton-triggers
    namespace: tekton-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-ci-triggers-eventlistener
subjects:
  - kind: ServiceAccount
    name: tekton-triggers
    namespace: tekton-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
---
# Build pods need no Kubernetes API access. Tekton Chains pushes signatures and
# provenance next to the images in zot with this account's `secrets` (since
# v0.30.0 it ignores imagePullSecrets).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-runner
  namespace: tekton-ci
automountServiceAccountToken: false
secrets:
  - name: registry-push
imagePullSecrets:
  - name: registry-push
---
# validate-infra runs on every branch push: no credentials at all. Tekton's creds-init
# would copy pipeline-runner's `secrets` into every step's ~/.docker/config.json.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: validate-runner
  namespace: tekton-ci
automountServiceAccountToken: false
---
# Runs the flux-sync task only (PipelineRun taskRunSpecs). Its permissions are
# the name-scoped Role in flux-system (apps/<project>/ci.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-sync
  namespace: tekton-ci
---
# Tekton Dashboard (full install) may create/cancel/delete runs here only, e.g. its Rerun
# button. Its cluster-wide edit bindings are deleted in controllers/tekton/patch-dashboard.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-dashboard-edit
  namespace: tekton-ci
subjects:
  - kind: ServiceAccount
    name: tekton-dashboard
    namespace: tekton-pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-aggregate-edit
