# EventListener: read Triggers/bindings/templates, create PipelineRuns.
# Both ClusterRoles ship with Tekton Triggers.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-triggers
  namespace: tekton-ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-triggers-eventlistener
  namespace: tekton-ci
subjects:
  - kind: ServiceAccount
    name: tekton-triggers
    namespace: tekton-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-ci-triggers-eventlistener
subjects:
  - kind: ServiceAccount
    name: tekton-triggers
    namespace: tekton-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
---
# Build pods need no Kubernetes API access. Tekton Chains reads this account's
# imagePullSecrets to push signatures and provenance next to the images in zot.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-runner
  namespace: tekton-ci
automountServiceAccountToken: false
imagePullSecrets:
  - name: registry-push
---
# Runs the flux-sync task only (PipelineRun taskRunSpecs). Its permissions are
# the name-scoped Role in flux-system (apps/<project>/ci.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-sync
  namespace: tekton-ci
