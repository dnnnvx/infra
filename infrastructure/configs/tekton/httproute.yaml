apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tekton-dashboard
  namespace: tekton-pipelines
spec:
  parentRefs:
    - name: homelab-local
      namespace: kube-system
      sectionName: https
  hostnames:
    - tekton.local.casasulgorgo.net
  rules:
    - backendRefs:
        - name: tekton-dashboard
          namespace: tekton-pipelines
          port: 9097
