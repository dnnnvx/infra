# Tangled push webhooks → EventListener
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: eventlistener-tangled
  namespace: tekton-ci
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: https
  hostnames:
    - ci.casasulgorgo.net
  rules:
    - matches:
        - method: POST
          path:
            type: Exact
            value: /
      backendRefs:
        - name: el-tangled
          port: 8080
