# tekton-ci has to be PodSecurity "privileged" (rootless BuildKit needs
# Unconfined seccomp/AppArmor), which also opens hostPath, host namespaces and
# privileged containers. This puts the fence back:
#  - nobody gets host access or privileged/extra capabilities in tekton-ci
#  - Unconfined profiles only for pods the Tekton controller creates (TaskRuns)
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tekton-ci-pod-restrictions
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: tekton-ci
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
    - name: unconfined
      expression: >-
        (has(object.spec.securityContext) && (
          (has(object.spec.securityContext.seccompProfile) && object.spec.securityContext.seccompProfile.type == 'Unconfined') ||
          (has(object.spec.securityContext.appArmorProfile) && object.spec.securityContext.appArmorProfile.type == 'Unconfined'))) ||
        variables.containers.exists(c, has(c.securityContext) && (
          (has(c.securityContext.seccompProfile) && c.securityContext.seccompProfile.type == 'Unconfined') ||
          (has(c.securityContext.appArmorProfile) && c.securityContext.appArmorProfile.type == 'Unconfined'))) ||
        (has(object.metadata.annotations) && object.metadata.annotations.exists(k,
          k.startsWith('container.apparmor.security.beta.kubernetes.io/') && object.metadata.annotations[k] == 'unconfined'))
  validations:
    - expression: >-
        !(has(object.spec.hostNetwork) && object.spec.hostNetwork) &&
        !(has(object.spec.hostPID) && object.spec.hostPID) &&
        !(has(object.spec.hostIPC) && object.spec.hostIPC)
      message: host namespaces are not allowed in tekton-ci
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))
      message: hostPath volumes are not allowed in tekton-ci
    - expression: >-
        variables.containers.all(c, !has(c.securityContext) || (
          !(has(c.securityContext.privileged) && c.securityContext.privileged) &&
          !(has(c.securityContext.capabilities) && has(c.securityContext.capabilities.add) && size(c.securityContext.capabilities.add) > 0) &&
          !(has(c.ports) && c.ports.exists(p, has(p.hostPort) && p.hostPort != 0))))
      message: privileged containers, added capabilities and hostPorts are not allowed in tekton-ci
    - expression: >-
        !variables.unconfined ||
        request.userInfo.username == 'system:serviceaccount:tekton-pipelines:tekton-pipelines-controller'
      message: Unconfined seccomp/AppArmor is reserved for Tekton TaskRun pods
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tekton-ci-pod-restrictions
spec:
  policyName: tekton-ci-pod-restrictions
  validationActions: [Deny]
