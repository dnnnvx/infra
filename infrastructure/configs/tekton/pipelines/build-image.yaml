apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-image
  namespace: tekton-ci
spec:
  description: >-
    Clone a commit, build its images under the commit tag, then SBOM + vulnerability scan them
    in parallel. Holds no signing key and moves no release tag: Tekton Chains signs the result
    once the run succeeds, and the release-image pipeline takes it from there.
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
    - name: registry
      type: string
    - name: project
      type: string
    - name: images
      type: string
      description: >-
        Space-separated entries in the builder's format: "name,dockerfile,context" for buildkit,
        "name,attr,flakedir" for nix-build.
    - name: builder
      type: string
      default: buildkit
      description: >-
        Build Task in tekton-ci, resolved by name: buildkit (Dockerfile) or nix-build (flake +
        nix2container). Both take the same params and return the same results.
    # The next two are only read by the release trigger (from this run's spec)
    - name: tags
      type: string
      description: Space-separated tags release-image moves to the images, e.g. "<sha> latest production".
    - name: flux-kustomization
      type: string
      default: ""
      description: The app's Flux Kustomization release-image reconciles and waits for. Empty skips the Flux sync.
  workspaces:
    - name: source
  results:
    - name: commit
      value: $(tasks.clone.results.commit)
    - name: digests
      value: $(tasks.build.results.digests)
    # Chains type hint: subjects of this run's SLSA provenance
    - name: IMAGES
      value: $(tasks.build.results.IMAGES)
    - name: sboms
      value: $(tasks.sbom.results.sboms)
  tasks:
    # retries only on network-bound tasks: a failed build is deterministic, retrying just burns time
    - name: clone
      retries: 2
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source
    - name: build
      runAfter:
        - clone
      # Cluster resolver so the Task name can be a param; the pipeline (and so the name Kyverno
      # and trigger-release pin) stays build-image whichever builder runs
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: $(params.builder)
          - name: namespace
            value: tekton-ci
      params:
        - name: registry
          value: $(params.registry)
        - name: project
          value: $(params.project)
        - name: images
          value: $(params.images)
        # Only the immutable tag: release-image moves the others once Chains has signed the images
        - name: tags
          value: $(tasks.clone.results.commit)
        - name: commit-timestamp
          value: $(tasks.clone.results.commit-timestamp)
      workspaces:
        - name: source
          workspace: source
    - name: sbom
      retries: 2
      runAfter:
        - build
      taskRef:
        name: sbom
      params:
        - name: registry
          value: $(params.registry)
        - name: project
          value: $(params.project)
        - name: digests
          value: $(tasks.build.results.digests)
    # grype's vulnerability DB download is the usual flake
    - name: scan
      retries: 2
      runAfter:
        - build
      taskRef:
        name: scan-image
      params:
        - name: registry
          value: $(params.registry)
        - name: project
          value: $(params.project)
        - name: digests
          value: $(tasks.build.results.digests)
    # Lockfiles + nix-build's closure SBOMs: what scan-image can't see in bundled, static or Nix images.
    # After build: it reads the sboms/ that nix-build writes into the workspace
    - name: scan-source
      retries: 2
      runAfter:
        - build
      taskRef:
        name: scan-source
      workspaces:
        - name: source
          workspace: source
