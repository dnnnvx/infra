# Tekton Dashboard (read-only), LAN only like the other *.local.casasulgorgo.net services.
# Lives in tekton-pipelines so it can reference the Service without a ReferenceGrant.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tekton-dashboard
  namespace: tekton-pipelines
spec:
  parentRefs:
    - name: homelab-local
      namespace: kube-system
      sectionName: https
  hostnames:
    - tekton.local.casasulgorgo.net
  rules:
    - backendRefs:
        - name: tekton-dashboard
          port: 9097
