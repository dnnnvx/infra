apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # tekton-ci namespace and its fences
  - namespace.yaml
  - ciliumnetworkpolicy.yaml
  - limitrange.yaml
  - rbac.yaml
  - secrets.yaml
  - git-ssh-secret.yaml
  - nix-cache-signing-key.yaml
  - image-policy.yaml
  - dashboard-httproute.yaml
  - dashboard-oauth2-proxy.yaml
  - dashboard-oauth2-proxy-secret.yaml
  - tasks
  - pipelines
  - triggers
configMapGenerator:
  # Public half of the Tekton Chains key: the release pipeline verifies images against it
  - name: chains-public-key
    namespace: tekton-ci
    files:
      - cosign.pub=chains.pub
    options:
      disableNameSuffixHash: true
replacements:
  # Kyverno verifies deployed images against the same key (image-policy.yaml)
  - source:
      kind: ConfigMap
      name: chains-public-key
      fieldPath: data.[cosign.pub]
    targets:
      - select:
          kind: ImageValidatingPolicy
          name: chains-signed-images
        fieldPaths:
          - spec.attestors.[name=chains].cosign.key.data
