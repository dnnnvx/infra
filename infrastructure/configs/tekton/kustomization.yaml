apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # tekton-ci namespace and its fences
  - namespace.yaml
  - ciliumnetworkpolicy.yaml
  - admission-policy.yaml
  - limitrange.yaml
  - rbac.yaml
  - secrets.yaml
  - dashboard-httproute.yaml
  - tasks
  - pipelines
  - triggers
configMapGenerator:
  # Public half of the Tekton Chains key: the release pipeline verifies images against it
  - name: chains-public-key
    namespace: tekton-ci
    files:
      - cosign.pub=chains.pub
    options:
      disableNameSuffixHash: true
