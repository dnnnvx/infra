apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildkit
  namespace: tekton-ci
spec:
  description: >-
    Builds each requested image with rootless BuildKit, one after the other, and pushes it
    under several tags with a registry build cache.
  params:
    - name: registry
      type: string
      description: Registry host[:port] to push to, e.g. zot.zot.svc.cluster.local:5000.
    - name: project
      type: string
      description: Registry namespace; images are <registry>/<project>/<name>.
    - name: images
      type: string
      description: >-
        Space-separated "name,dockerfile,context" entries. Dockerfile is relative to the
        context, the context to the repository root.
    - name: tags
      type: string
      description: Space-separated tags to push (e.g. "<sha> latest production").
    - name: subdirectory
      type: string
      default: source
      description: Where git-clone put the repository inside the source workspace.
  workspaces:
    - name: source
      readOnly: true
  results:
    - name: digests
      description: Space-separated "name=sha256:..." for every pushed image.
    - name: IMAGES
      description: >-
        Comma-separated <image>@<digest> of every pushed image. Type hint for Tekton Chains,
        which signs these images and makes them the subjects of the run's SLSA provenance.
  volumes:
    - name: buildkit-state
      emptyDir: {}
    - name: registry-auth
      secret:
        secretName: registry-push
        items:
          - key: .dockerconfigjson
            path: config.json
  steps:
    - name: build-and-push
      image: moby/buildkit:v0.34.0-rootless
      workingDir: $(workspaces.source.path)/$(params.subdirectory)
      env:
        # No nested PID namespace: needed to run without privileged
        - name: BUILDKITD_FLAGS
          value: --oci-worker-no-process-sandbox
        - name: DOCKER_CONFIG
          value: /docker-config
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
      volumeMounts:
        - name: buildkit-state
          mountPath: /home/user/.local/share/buildkit
        - name: registry-auth
          mountPath: /docker-config
          readOnly: true
      script: |
        #!/bin/sh
        set -eu
        # Avoid dollar-brace syntax here: Flux post-build substitution would eat it
        root="$(pwd)"
        : > "$(results.digests.path)"
        : > "$(results.IMAGES.path)"
        for entry in $(params.images); do
          name="$(echo "$entry" | cut -d, -f1)"
          dockerfile="$(echo "$entry" | cut -d, -f2)"
          context="$(echo "$entry" | cut -d, -f3)"
          image="$(params.registry)/$(params.project)/$name"
          cache="$(params.registry)/cache/$(params.project)/$name:buildcache"
          names=""
          for tag in $(params.tags); do
            [ -n "$names" ] && names="$names,"
            names="$names""$image:$tag"
          done
          cd "$root/$context"
          # zot is reached over plain HTTP on its in-cluster Service, hence registry.insecure
          buildctl-daemonless.sh build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile="$(dirname "$dockerfile")" \
            --opt filename="$(basename "$dockerfile")" \
            --import-cache "type=registry,ref=$cache,registry.insecure=true" \
            --export-cache "type=registry,ref=$cache,mode=max,image-manifest=true,oci-mediatypes=true,registry.insecure=true" \
            --output "type=image,\"name=$names\",push=true,registry.insecure=true" \
            --metadata-file /tmp/metadata.json
          digest="$(sed -n 's/.*"containerimage.digest": *"\([^"]*\)".*/\1/p' /tmp/metadata.json | tr -d '\n')"
          printf '%s=%s ' "$name" "$digest" >> "$(results.digests.path)"
          [ -s "$(results.IMAGES.path)" ] && printf ',' >> "$(results.IMAGES.path)"
          printf '%s@%s' "$image" "$digest" >> "$(results.IMAGES.path)"
          echo "Pushed $names @ $digest"
        done
