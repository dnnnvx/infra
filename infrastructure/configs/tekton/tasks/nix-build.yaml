apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nix-build
  namespace: tekton-ci
spec:
  description: >-
    Builds each requested image from the repository's flake (nix2container) and pushes it with
    skopeo. Needs no user namespaces or privileges: Nix runs single-user, unsandboxed (the pod
    is the sandbox), non-root and under RuntimeDefault seccomp, so tekton-ci stays PodSecurity
    restricted. The flake sets the label ci.casasulgorgo.net/commit-timestamp itself from
    self.lastModified (the commit date); release-image refuses to move tags to an image without
    it. Builds substitute from the Nix cache on RustFS (bucket nix-cache, tofu/modules/rustfs), and
    push-cache then uploads every path this run built or fetched itself, signed; the signing key
    and write credentials live only in that step's container, never where builds run. A cache
    outage only costs speed: fallback builds locally and push-cache may fail without failing the
    run. Then scan-closure, per image, writes a CycloneDX
    SBOM of the runtime closure (sbomnix) to sboms/images/<name>.cdx.json in the workspace, which
    the sbom task attaches, and checks that closure for CVEs with vulnix (patch-aware). The vulnix
    check fails the run only if the flake directory has a vulnix.toml (its whitelist); without one
    it only reports.
  params:
    - name: registry
      type: string
      description: Registry host[:port] to push to, e.g. registry.local.casasulgorgo.net.
    - name: project
      type: string
      description: Registry namespace; images are <registry>/<project>/<name>.
    - name: images
      type: string
      description: >-
        Space-separated "name,attr,flakedir" entries: attr is a nix2container image under
        packages.<system> (e.g. image), flakedir the flake's directory relative to the repository
        root (usually ".").
    - name: tags
      type: string
      description: Space-separated tags to push (e.g. "<sha> latest production").
    - name: subdirectory
      type: string
      default: source
      description: Where git-clone put the repository inside the source workspace.
  workspaces:
    - name: source
  results:
    - name: digests
      description: Space-separated "name=sha256:..." for every pushed image.
    - name: IMAGES
      description: >-
        Comma-separated <image>@<digest> of every pushed image. Type hint for Tekton Chains,
        which signs these images and makes them the subjects of the run's SLSA provenance.
  volumes:
    # A writable copy of the image's /nix, owned by the step user: single-user Nix needs to own
    # its store, and nixos/nix ships it root-owned. Cross-run caching is the S3 cache, not this.
    - name: nix
      emptyDir: {}
    - name: nix-cache-signing-key
      secret:
        secretName: nix-cache-signing-key
    - name: registry-auth
      secret:
        secretName: registry-push
        items:
          - key: .dockerconfigjson
            path: config.json
  stepTemplate:
    image: nixos/nix:2.36.0
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
    env:
      # Nix ignores a $HOME owned by someone else (/tmp is root's) and falls back to passwd,
      # which has no entry for uid 1000. A not-yet-existing path is accepted (created on use).
      - name: HOME
        value: /tmp/home
      - name: TMPDIR
        value: /tmp
      # The cache is a plain S3 binary cache, in-cluster (no TLS, never leaves the node network).
      # fallback: build locally when a narinfo outlives its expired NAR (bucket lifecycle).
      - name: NIX_CONFIG
        value: |
          experimental-features = nix-command flakes
          sandbox = false
          build-users-group =
          max-jobs = 2
          cores = 2
          accept-flake-config = false
          extra-substituters = s3://nix-cache?endpoint=http://rustfs.rustfs.svc.cluster.local:9000&region=us-east-1
          extra-trusted-public-keys = nix-cache.casasulgorgo.net-1:HlVXAzlw48Zg2l70GCgBIVL+uKsZzpHmSbswgU6LHDg=
          fallback = true
      # Read-only cache credentials (tofu: module "rustfs"); push-cache swaps in the write ones.
      # Optional: without them the cache answers 403 and Nix just skips it.
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: nix-cache-read
            key: AWS_ACCESS_KEY_ID
            optional: true
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: nix-cache-read
            key: AWS_SECRET_ACCESS_KEY
            optional: true
      # vulnix (Python/click) refuses to start without a UTF-8 locale
      - name: LANG
        value: C.UTF-8
  steps:
    - name: seed-store
      volumeMounts:
        - name: nix
          mountPath: /nix-rw
      script: |
        #!/bin/sh
        set -eu
        # Copy the children, not "/nix/.": a non-root user can't set times on the mount point.
        # Skip the db lock files (root-only 0600 since nix 2.36); Nix recreates them.
        for e in /nix/*; do [ "$e" = /nix/var ] || cp -a "$e" /nix-rw/; done
        mkdir -p /nix-rw/var/nix/db
        for e in /nix/var/*; do [ "$e" = /nix/var/nix ] || cp -a "$e" /nix-rw/var/; done
        for e in /nix/var/nix/*; do [ "$e" = /nix/var/nix/db ] || cp -a "$e" /nix-rw/var/nix/; done
        for e in /nix/var/nix/db/*; do
          case "$e" in */big-lock|*/reserved) ;; *) cp -a "$e" /nix-rw/var/nix/db/ ;; esac
        done
        # The emptyDir root is setgid (fsGroup) and new dirs inherit it. Nix's syscall filter refuses
        # setgid modes, so a build under /nix/var/nix/builds fails in unpackPhase (cp: setting permissions).
        find /nix-rw -mindepth 1 -type d -perm -2000 -exec chmod g-s {} +
    - name: build-and-push
      # A failure doesn't stop the TaskRun here: push-cache still uploads what got built (e.g.
      # crane's dependencies when the app itself fails to compile), then scan-closure fails the run
      # with this step's exit code
      onError: continue
      workingDir: $(workspaces.source.path)/$(params.subdirectory)
      env:
        - name: REGISTRY_AUTH_FILE
          value: /docker-config/config.json
      # CPU stays at 2 of the NUCs' 4 cores
      computeResources:
        requests:
          cpu: "1"
          memory: 3Gi
        limits:
          cpu: "2"
          memory: 3Gi
      volumeMounts:
        - name: nix
          mountPath: /nix
        - name: registry-auth
          mountPath: /docker-config
          readOnly: true
      script: |
        #!/bin/sh
        set -eu
        # Avoid dollar-brace syntax here: Flux post-build substitution would eat it
        root="$(pwd)"
        : > "$(results.digests.path)"
        : > "$(results.IMAGES.path)"
        for entry in $(params.images); do
          name="$(echo "$entry" | cut -d, -f1)"
          attr="$(echo "$entry" | cut -d, -f2)"
          dir="$(echo "$entry" | cut -d, -f3)"
          image="$(params.registry)/$(params.project)/$name"
          # git+file (not path:) so self.lastModified is the commit date; git-clone is shallow
          flake="git+file://$root?shallow=1"
          [ "$dir" != "." ] && flake="$flake&dir=$dir"
          nix flake check --print-build-logs "$flake"
          digest=""
          for tag in $(params.tags); do
            nix run --print-build-logs "$flake#$attr.copyTo" -- \
              --digestfile /tmp/digest "docker://$image:$tag"
            digest="$(cat /tmp/digest)"
          done
          printf '%s=%s ' "$name" "$digest" >> "$(results.digests.path)"
          [ -s "$(results.IMAGES.path)" ] && printf ',' >> "$(results.IMAGES.path)"
          printf '%s@%s' "$image" "$digest" >> "$(results.IMAGES.path)"
          echo "Pushed $image ($(params.tags)) @ $digest"
        done
    - name: push-cache
      # Best effort: a cache outage must not fail a run whose images are already pushed
      onError: continue
      env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: nix-cache-write
              key: AWS_ACCESS_KEY_ID
              optional: true
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: nix-cache-write
              key: AWS_SECRET_ACCESS_KEY
              optional: true
      computeResources:
        limits:
          memory: 1Gi
      volumeMounts:
        - name: nix
          mountPath: /nix
        - name: nix-cache-signing-key
          mountPath: /nix-cache-key
          readOnly: true
      script: |
        #!/bin/sh
        set -eu
        # Only what this run built or fetched itself (crane's deps, npm/crate tarballs, the image
        # layers): cache.nixos.org paths are fetched from there, our own cache's are already there.
        # .drv files are skipped too: substituters never need them.
        # nixos/nix has grep and cut but no awk/sed. Lines are "<path><spaces><tab><sigs>".
        nix path-info --all --sigs \
          | grep -vE 'cache\.nixos\.org-1:|nix-cache\.casasulgorgo\.net-1:' \
          | cut -d' ' -f1 | cut -f1 | grep -v '\.drv$' \
          > /tmp/paths
        echo "Pushing $(wc -l < /tmp/paths) store paths to the Nix cache"
        # secret-key signs every narinfo on upload; nix copy skips paths the cache already has
        nix copy --stdin \
          --to "s3://nix-cache?endpoint=http://rustfs.rustfs.svc.cluster.local:9000&region=us-east-1&compression=zstd&secret-key=/nix-cache-key/key" \
          < /tmp/paths
    - name: scan-closure
      workingDir: $(workspaces.source.path)/$(params.subdirectory)
      # vulnix holds the NVD feeds in memory and sbomnix's metadata pass evaluates nixpkgs: at 2Gi
      # vulnix got the step OOMKilled and sbomnix's nix eval child was killed (SBOM without licenses)
      # (steps run one after another; Tekton requests only the largest step's memory for the pod)
      computeResources:
        limits:
          memory: 3Gi
      volumeMounts:
        - name: nix
          mountPath: /nix
      script: |
        #!/bin/sh
        set -eu
        # build-and-push has onError: continue, so its failure is turned back into the run's here
        rc="$(cat $(steps.step-build-and-push.exitCode.path))"
        if [ "$rc" != 0 ]; then
          echo "build-and-push failed (exit $rc); its finished store paths are cached, see its log" >&2
          exit "$rc"
        fi
        # Avoid dollar-brace syntax here: Flux post-build substitution would eat it
        root="$(pwd)"
        for entry in $(params.images); do
          name="$(echo "$entry" | cut -d, -f1)"
          attr="$(echo "$entry" | cut -d, -f2)"
          dir="$(echo "$entry" | cut -d, -f3)"
          flake="git+file://$root?shallow=1"
          [ "$dir" != "." ] && flake="$flake&dir=$dir"

          # Runtime closure (node, glibc, …), what dpkg used to tell syft/grype on distroless images.
          # Tools come from the flake's own nixpkgs (--inputs-from): no second nixpkgs download.
          # sbomnix also writes sbom.spdx.json and sbom.csv to its working directory, hence cd /tmp.
          mkdir -p "$(workspaces.source.path)/sboms/images"
          (cd /tmp && nix run --inputs-from "$flake" nixpkgs#sbomnix -- \
            --cdx "$(workspaces.source.path)/sboms/images/$name.cdx.json" "$flake#$attr")

          # vulnix skips CVEs that a nixpkgs patch names (CVE-xxxx-yyyy.patch), unlike CPE matching.
          # Exit 2 means findings or an error; only findings print a JSON report on stdout.
          out="$(nix build --no-link --print-out-paths "$flake#$attr")"
          whitelist="$root/$dir/vulnix.toml"
          if [ -f "$whitelist" ]; then set -- --whitelist "$whitelist"; else set --; fi
          # vulnix fetches the NVD feeds with a fixed 10 s read timeout and nvd.nist.gov is often slow:
          # retry errors (any exit but 0/2). Feeds already downloaded stay in --cache-dir.
          for attempt in 1 2 3; do
            rc=0
            nix run --inputs-from "$flake" nixpkgs#vulnix -- --closure --json \
              --cache-dir /tmp/vulnix "$@" "$out" > "/tmp/vulnix-$name.json" || rc=$?
            case "$rc" in 0|2) break ;; esac
            echo "vulnix failed (exit $rc), attempt $attempt of 3" >&2
            [ "$attempt" = 3 ] || sleep $((attempt * 30))
          done
          case "$rc" in
            0) echo "vulnix: no known CVEs in the $name closure" ;;
            2)
              [ -s "/tmp/vulnix-$name.json" ] || { echo "vulnix failed" >&2; exit 1; }
              echo "vulnix: CVEs in the $name closure (https://nvd.nist.gov/vuln/detail/<id>):"
              nix run --inputs-from "$flake" nixpkgs#jq -- -r \
                '.[] | "  \(.name): \(.affected_by | join(" "))"' "/tmp/vulnix-$name.json"
              if [ -f "$whitelist" ]; then
                echo "Fix them (nixpkgs bump) or add them to vulnix.toml with an until date" >&2
                exit 1
              fi
              echo "Report only: add a vulnix.toml to the flake directory to fail on these"
              ;;
            *) echo "vulnix failed (exit $rc)" >&2; exit 1 ;;
          esac
        done
