apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: flux-sync
  namespace: tekton-ci
spec:
  description: >-
    Skips Flux's polling intervals after a build: waits until each ImagePolicy has
    resolved the pushed digest, makes ImageUpdateAutomation commit them, then
    reconciles the app's own Flux Kustomization and waits for its rollout.
    Needs the flux-sync ServiceAccount and the app's Role in flux-system.
  params:
    - name: project
      type: string
      description: ImageRepository/ImagePolicy of an image are named <project>-<image name>.
    - name: digests
      type: string
      description: Space-separated "name=sha256:..." as returned by the buildkit task.
    - name: kustomization
      type: string
      description: Name of the app's Flux Kustomization (wait - true) in flux-system.
    - name: automation
      type: string
      default: apps
      description: ImageUpdateAutomation that commits the digests.
    - name: timeout
      type: string
      default: 7m
      description: How long to wait for the Kustomization to become ready.
  steps:
    - name: sync
      image: ghcr.io/fluxcd/flux-cli:v2.10.0
      env:
        - name: HOME
          value: /tmp
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      script: |
        #!/bin/sh
        set -eu
        ns=flux-system
        for entry in $(params.digests); do
          policy="$(params.project)-$(echo "$entry" | cut -d= -f1)"
          digest="$(echo "$entry" | cut -d= -f2)"
          flux reconcile image repository "$policy" -n "$ns" --timeout=2m
          # The policy follows the repository scan asynchronously: wait for the pushed digest
          i=0
          until [ "$(kubectl -n "$ns" get imagepolicy "$policy" -o jsonpath='{.status.latestRef.digest}')" = "$digest" ]; do
            i=$((i + 1))
            if [ "$i" -gt 30 ]; then
              echo "ImagePolicy $policy never resolved $digest" >&2
              exit 1
            fi
            sleep 2
          done
        done
        flux reconcile image update "$(params.automation)" -n "$ns" --timeout=2m
        flux reconcile kustomization "$(params.kustomization)" -n "$ns" --with-source --timeout="$(params.timeout)"
