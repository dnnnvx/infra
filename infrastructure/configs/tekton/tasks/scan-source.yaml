apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: scan-source
  namespace: tekton-ci
spec:
  description: >-
    Catalogs the source's lockfiles (package-lock.json, Cargo.lock, go.sum, …) with syft and fails
    on any known vulnerability of the given severity or worse that has a fix (grype). Covers what
    scan-image can't see: dependencies bundled by adapter-node, statically linked Rust/Go, and Nix
    images, which have no package database. Leaves the SBOM at sboms/lockfiles.cdx.json in the
    workspace, which the sbom task attaches to every image. Time-boxed exceptions: .grype-ignore.
  params:
    - name: subdirectory
      type: string
      default: source
      description: Where git-clone put the repository inside the source workspace.
    - name: fail-on
      type: string
      default: high
      description: Lowest grype severity that fails the run (only vulnerabilities that have a fix count).
  workspaces:
    - name: source
  stepTemplate:
    env:
      - name: HOME
        value: /tmp
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
  steps:
    - name: syft
      image: anchore/syft:v1.57.2-debug
      env:
        # adapter-node bundles devDependencies into build/: they ship, so they count
        - name: SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES
          value: "true"
      script: |
        #!/busybox/sh
        set -eu
        mkdir -p "$(workspaces.source.path)/sboms"
        /syft scan "dir:$(workspaces.source.path)/$(params.subdirectory)" --exclude './.git/**' \
          --output "cyclonedx-json=$(workspaces.source.path)/sboms/lockfiles.cdx.json"
    - name: grype
      image: anchore/grype:v0.122.1-debug
      env:
        - name: GRYPE_DB_CACHE_DIR
          value: /tmp/grype-db
      script: |
        #!/busybox/sh
        set -eu
        # .grype-ignore at the repo root: "<CVE/GHSA id> <until YYYY-MM-DD> <reason>" per line. Only
        # these ids are ignored (no other grype options), and a malformed or expired line fails the run.
        ignore="$(workspaces.source.path)/$(params.subdirectory)/.grype-ignore"
        printf 'ignore:\n' > /tmp/grype.yaml
        if [ -f "$ignore" ]; then
          awk -v today="$(date -u +%F)" '
            /^[[:space:]]*(#|$)/ { next }
            $1 !~ /^(CVE-[0-9]{4}-[0-9]+|GHSA(-[0-9a-z]{4}){3})$/ || $2 !~ /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/ || NF < 3 {
              printf ".grype-ignore:%d: want <CVE/GHSA id> <until YYYY-MM-DD> <reason>\n", NR > "/dev/stderr"; bad = 1; next
            }
            $2 < today { printf ".grype-ignore:%d: %s expired on %s\n", NR, $1, $2 > "/dev/stderr"; bad = 1; next }
            { printf "  - vulnerability: %s\n", $1; printf "Ignoring %s until %s\n", $1, $2 > "/dev/stderr" }
            END { exit bad }' "$ignore" >> /tmp/grype.yaml
        fi
        /grype "sbom:$(workspaces.source.path)/sboms/lockfiles.cdx.json" --config /tmp/grype.yaml \
          --only-fixed --fail-on "$(params.fail-on)"
