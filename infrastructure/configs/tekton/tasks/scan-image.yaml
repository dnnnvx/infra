apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: scan-image
  namespace: tekton-ci
spec:
  description: >-
    Scans each built image for known vulnerabilities (grype) and fails on any of the given
    severity or worse that has a fix. A failed scan fails the build PipelineRun, so the
    image never gets released. Time-boxed exceptions: .grype-ignore in the repository.
  params:
    - name: registry
      type: string
      description: Registry host[:port], e.g. registry.local.casasulgorgo.net.
    - name: project
      type: string
      description: Registry namespace; images are <registry>/<project>/<name>.
    - name: digests
      type: string
      description: Space-separated "name=sha256:..." as returned by the nix-build task.
    - name: fail-on
      type: string
      default: high
      description: Lowest grype severity that fails the run (only vulnerabilities that have a fix count).
    - name: subdirectory
      type: string
      default: source
      description: Where git-clone put the repository inside the source workspace.
  workspaces:
    - name: source
      readOnly: true
      description: The cloned repository, read for its .grype-ignore.
  steps:
    - name: grype
      image: anchore/grype:v0.122.1-debug
      env:
        - name: HOME
          value: /tmp
        - name: GRYPE_DB_CACHE_DIR
          value: /tmp/grype-db
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      script: |
        #!/busybox/sh
        set -eu
        # .grype-ignore at the repo root: "<CVE/GHSA id> <until YYYY-MM-DD> <reason>" per line. Only
        # these ids are ignored (no other grype options), and a malformed or expired line fails the run.
        ignore="$(workspaces.source.path)/$(params.subdirectory)/.grype-ignore"
        printf 'ignore:\n' > /tmp/grype.yaml
        if [ -f "$ignore" ]; then
          awk -v today="$(date -u +%F)" '
            /^[[:space:]]*(#|$)/ { next }
            $1 !~ /^(CVE-[0-9]{4}-[0-9]+|GHSA(-[0-9a-z]{4}){3})$/ || $2 !~ /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/ || NF < 3 {
              printf ".grype-ignore:%d: want <CVE/GHSA id> <until YYYY-MM-DD> <reason>\n", NR > "/dev/stderr"; bad = 1; next
            }
            $2 < today { printf ".grype-ignore:%d: %s expired on %s\n", NR, $1, $2 > "/dev/stderr"; bad = 1; next }
            { printf "  - vulnerability: %s\n", $1; printf "Ignoring %s until %s\n", $1, $2 > "/dev/stderr" }
            END { exit bad }' "$ignore" >> /tmp/grype.yaml
        fi
        for entry in $(params.digests); do
          ref="$(params.registry)/$(params.project)/$(echo "$entry" | cut -d= -f1)@$(echo "$entry" | cut -d= -f2)"
          echo "Scanning $ref"
          /grype "registry:$ref" --config /tmp/grype.yaml --only-fixed --fail-on "$(params.fail-on)"
        done
