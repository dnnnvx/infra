# Flux naming convention: ImageRepository/ImagePolicy <project>-<image-name>, Kustomization app-<project>.
# Images are <registry>/<project>/<image>, e.g. registry.local.casasulgorgo.net/casasulgorgo/web.
# Build caches live apart under <registry>/cache/<project>/<image> so they
# don't show up as tags of the real image.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: build-image
  namespace: tekton-ci
spec:
  params:
    - name: registry
      default: registry.local.casasulgorgo.net
    - name: project
    - name: images
    - name: repo-url
    - name: revision
    - name: tags
    - name: flux-kustomization
      default: ""
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: $(tt.params.project)-
        labels:
          ci.casasulgorgo.net/project: $(tt.params.project)
      spec:
        pipelineRef:
          name: build-image
        params:
          - name: repo-url
            value: $(tt.params.repo-url)
          - name: revision
            value: $(tt.params.revision)
          - name: registry
            value: $(tt.params.registry)
          - name: project
            value: $(tt.params.project)
          - name: images
            value: $(tt.params.images)
          - name: tags
            value: $(tt.params.tags)
          - name: flux-kustomization
            value: $(tt.params.flux-kustomization)
        taskRunTemplate:
          serviceAccountName: pipeline-runner
          podTemplate:
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
        workspaces:
          # Deleted with the PipelineRun (see the Tekton pruner config)
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                storageClassName: piraeus-scratch
                resources:
                  requests:
                    storage: 2Gi
