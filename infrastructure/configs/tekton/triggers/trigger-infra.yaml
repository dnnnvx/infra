# Validates every branch push of this repository (Flux's image automation commits on main included).
# The revision comes from the payload, which is trusted once the github interceptor has verified its
# HMAC signature (X-Hub-Signature-256). The clone URL is pinned rather than taken from the payload.
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: infra
  namespace: tekton-ci
  labels:
    ci.casasulgorgo.net/eventlistener: github
spec:
  interceptors:
    - name: verify-signature
      ref:
        name: github
        kind: ClusterInterceptor
      params:
        - name: secretRef
          value:
            secretName: github-webhook
            secretKey: secret
        - name: eventTypes
          value: ["push"]
    - name: filter
      ref:
        name: cel
        kind: ClusterInterceptor
      params:
        - name: filter
          value: >-
            body.repository.full_name == 'dnnnvx/infra' &&
            body.ref.startsWith('refs/heads/') &&
            body.after.matches('^[0-9a-f]{40}$') &&
            body.after != '0000000000000000000000000000000000000000'
  bindings:
    - name: repo-url
      value: https://github.com/dnnnvx/infra
    - name: revision
      value: $(body.after)
  template:
    ref: validate-infra
