# Validates every branch push of this repository (Flux's image automation commits on main included).
# The revision comes from the payload, which is trusted once the tangled interceptor has
# verified its HMAC signature. The clone URL is pinned: the payload's clone_url
# (knot/<owner-did>/<rkey>) isn't served by the knot, which addresses repos by repo DID now;
# tangled.org/<handle>/<name> redirects there.
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: infra
  namespace: tekton-ci
  labels:
    ci.casasulgorgo.net/eventlistener: tangled
spec:
  interceptors:
    - name: verify-signature
      ref:
        name: tangled
        kind: ClusterInterceptor
    - name: filter
      ref:
        name: cel
        kind: ClusterInterceptor
      params:
        - name: filter
          value: >-
            header.match('X-Tangled-Event', 'push') &&
            body.repository.name == 'infra' &&
            body.ref.startsWith('refs/heads/') &&
            body.after.matches('^[0-9a-f]{40}$') &&
            body.after != '0000000000000000000000000000000000000000'
  bindings:
    - name: repo-url
      value: https://tangled.org/casasulgorgo.net/infra
    - name: revision
      value: $(body.after)
  template:
    ref: validate-infra
