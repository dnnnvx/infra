# GitHub push webhooks → EventListener
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: eventlistener-github
  namespace: tekton-ci
  annotations:
    gateway.casasulgorgo.net/public: "true"
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: https
  hostnames:
    - ci.casasulgorgo.net
  rules:
    - matches:
        - method: POST
          path:
            type: Exact
            value: /
      backendRefs:
        - name: el-github
          port: 8080
