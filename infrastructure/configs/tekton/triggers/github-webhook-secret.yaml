# HMAC secret for the GitHub push webhooks, checked by the core `github` ClusterInterceptor (it reads it
# from the Trigger's namespace). Generated by tofu (random_password.github_webhook), which also sets it
# on each repo's webhook, and substituted from flux-substitutions: never in git.
apiVersion: v1
kind: Secret
metadata:
  name: github-webhook
  namespace: tekton-ci
stringData:
  secret: ${github_webhook_secret}
