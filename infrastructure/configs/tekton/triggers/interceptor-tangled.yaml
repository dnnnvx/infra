# Custom ClusterInterceptor, next to the core ones in tekton-pipelines.
# No CA bundle → Triggers calls it over plain HTTP (in-cluster only).
apiVersion: triggers.tekton.dev/v1alpha1
kind: ClusterInterceptor
metadata:
  name: tangled
spec:
  clientConfig:
    service:
      name: tangled-interceptor
      namespace: tekton-pipelines
      port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: tangled-interceptor
  namespace: tekton-pipelines
spec:
  selector:
    app.kubernetes.io/name: tangled-interceptor
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tangled-interceptor
  namespace: tekton-pipelines
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tangled-interceptor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tangled-interceptor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: interceptor
          image: ghcr.io/dnnnvx/tangled-interceptor:0.1.0
          env:
            - name: WEBHOOK_SECRET_FILE
              value: /secret/secret
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: secret
              mountPath: /secret
              readOnly: true
      volumes:
        - name: secret
          secret:
            # SOPS-encrypted in the overlay; paste the same value into each
            # Tangled repo's webhook "Secret" field
            secretName: tangled-webhook
