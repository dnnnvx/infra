# The dashboard has no auth of its own and can rerun/cancel/delete runs: only reachable
# through this proxy, which logs in against pocket-id (same setup as apps/llama-cpp).
# Pocket-id OIDC client callback: https://tekton.local.casasulgorgo.net/oauth2/callback
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tekton-dashboard-oauth2-proxy
  namespace: tekton-pipelines
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tekton-dashboard-oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tekton-dashboard-oauth2-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://auth.casasulgorgo.net
            - --email-domain=* # who may log in is restricted on the pocket-id client (allowed groups)
            - --upstream=http://tekton-dashboard.tekton-pipelines.svc.cluster.local:9097
            - --http-address=0.0.0.0:4180
            - --redirect-url=https://tekton.local.casasulgorgo.net/oauth2/callback
            - --reverse-proxy=true # trust X-Forwarded-* from the gateway
            - --cookie-secure=true
            - --skip-provider-button=true # straight to pocket-id, no interstitial
            - --code-challenge-method=S256 # PKCE
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tekton-dashboard-oauth2-proxy
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tekton-dashboard-oauth2-proxy
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: tekton-dashboard-oauth2-proxy
                  key: cookie-secret
          ports:
            - containerPort: 4180
              name: http
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tekton-dashboard-oauth2-proxy
  namespace: tekton-pipelines
spec:
  selector:
    app.kubernetes.io/name: tekton-dashboard-oauth2-proxy
  ports:
    - port: 4180
      targetPort: http
      name: http
