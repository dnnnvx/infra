# Admission-time check of what release-image already verifies: an image from our registry only runs
# if Tekton Chains signed it and attached SLSA provenance. Closes the gap where anyone able to push
# to zot (or move the `production` tag) would get an unsigned image deployed by Flux.
# Enforced by Kyverno (infrastructure/controllers/kyverno) in every namespace except the infrastructure
# ones below: the image reference is the selector, so any app built by this CI is covered without opt-in.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: chains-signed-images
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 15
  # Pods, plus autogen rules for Deployments etc., so Flux sees the rejection at apply time
  matchConstraints:
    # The webhook fails closed: keep the platform out of it, so a Kyverno outage can't stop Flux,
    # storage, databases, certs, the registry or CI from (re)starting. Add new infrastructure/ namespaces here.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kyverno
            - flux-system
            - piraeus-datastore
            - cnpg-system
            - cert-manager
            - zot
            - tekton-pipelines
            - tekton-pipelines-resolvers
            - tekton-chains
            - tekton-ci
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: registry.local.casasulgorgo.net/*
  validationConfigurations:
    # Flux already pins digests; mutating Flux-owned objects would only cause drift
    mutateDigest: false
    verifyDigest: true
    required: true
  attestors:
    - name: chains
      cosign:
        key:
          # chains.pub, injected by the replacement in kustomization.yaml
          data: CHAINS_PUBLIC_KEY
        # Chains runs with transparency disabled: no Rekor entry to check
        ctlog:
          insecureIgnoreTlog: true
  attestations:
    - name: slsa
      intoto:
        type: https://slsa.dev/provenance/v1
  variables:
    # `images` holds every image of the object; only ours are signed by Chains
    - name: ours
      expression: >-
        (images.containers + images.initContainers + images.ephemeralContainers)
        .filter(i, i.startsWith("registry.local.casasulgorgo.net/"))
  validations:
    - expression: variables.ours.all(i, verifyImageSignatures(i, [attestors.chains]) > 0)
      message: image is not signed by Tekton Chains
    - expression: variables.ours.all(i, verifyAttestationSignatures(i, attestations.slsa, [attestors.chains]) > 0)
      message: image has no SLSA provenance signed by Tekton Chains
    # What the (now verified) provenance says. Chains signs any PipelineRun in tekton-ci, including
    # ones started by hand, so pin how and from where the image was built. The branch isn't in the
    # provenance: only the GitHub Trigger's CEL filter (refs/heads/main) enforces that.
    - expression: >-
        variables.ours.all(i, extractPayload(i, attestations.slsa)
        .predicate.buildDefinition.externalParameters.runSpec.pipelineRef.name == "build-image")
      message: provenance says the image wasn't built by the build-image pipeline
    # Allowed sources (the Trigger's pinned repo-url): https://github.com/dnnnvx/<repo>.
    # The Tangled alternatives cover images built before the move to GitHub: drop them once every
    # app has been rebuilt from GitHub.
    - expression: >-
        variables.ours.all(i, extractPayload(i, attestations.slsa)
        .predicate.buildDefinition.externalParameters.runSpec.params
        .exists(p, p.name == "repo-url" && p.value.matches(r"^https://(github\.com/dnnnvx/[A-Za-z0-9_.-]+$|knot1\.tangled\.sh/did:plc:qzac7ebdharodtvwlxb7wsof(/|$)|tangled\.org/did:plc:fz72ds7ns4fx6npepwtfnzag(/|$))")))
      message: provenance says the image wasn't built from one of our GitHub repositories
    # Kyverno already matches the subject digest; also require the subject name to be the repository the
    # image is pulled from, so a signed image copied into another app's repository is rejected.
    - expression: >-
        variables.ours.all(i, extractPayload(i, attestations.slsa)
        .subject.exists(s, i.startsWith(s.name + ":") || i.startsWith(s.name + "@")))
      message: provenance was issued for a different image repository
