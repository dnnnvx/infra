apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
  namespace: kube-system
spec:
  parentRefs:
    - name: homelab-local
      namespace: kube-system
      sectionName: https
  hostnames:
    - hubble.local.casasulgorgo.net
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
