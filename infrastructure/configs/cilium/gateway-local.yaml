# LAN-only Gateway for *.local.casasulgorgo.net. The router port-forwards 443
# to 192.168.0.200 only, so routes here are unreachable from the internet.
# AdGuard rewrites *.local.casasulgorgo.net → 192.168.0.202 (set in its UI);
# the names are never published in Cloudflare.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-local
  namespace: kube-system
  annotations:
    io.cilium/lb-ipam-ips: "192.168.0.202"
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.local.casasulgorgo.net"
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.local.casasulgorgo.net"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-casasulgorgo-net
            kind: Secret
            namespace: kube-system
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homelab-local-https-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: homelab-local
      namespace: kube-system
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
