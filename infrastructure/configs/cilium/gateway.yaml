apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
  namespace: kube-system
  annotations:
    io.cilium/lb-ipam-ips: "192.168.0.200"
    # defaults inherited by every gatus-sidecar endpoint generated from a route on this Gateway
    gatus.home-operations.com/endpoint: |
      group: apps
      interval: 5m
      alerts:
        - type: matrix
          send-on-resolved: true
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-casasulgorgo-net
            kind: Secret
            namespace: kube-system
      allowedRoutes:
        namespaces:
          from: All
