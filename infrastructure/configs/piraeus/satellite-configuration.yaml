# Talos-specific overrides (removes systemd/module-loader deps, fixes LVM paths)
# see: https://piraeus.io/docs/stable/how-to/talos/#configure-talos-system-extension-for-drbd
# - /etc/lvm/* is read-only in Talos and therefore can't be used. Let's use /var/etc/lvm/* instead.
# - Talos does not ship with Systemd, so everything Systemd related needs to be removed
# - /usr/lib/modules and /usr/src are not needed as the Kernel module is already compiled and needs just to be used.
apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: talos-loader-override
  namespace: piraeus-datastore
spec:
  # Same limit as clusters/production/revision-history.yaml
  patches:
    - target:
        kind: DaemonSet
      patch: '[{"op": "add", "path": "/spec/revisionHistoryLimit", "value": 3}]'
  podTemplate:
    spec:
      initContainers:
        - name: drbd-shutdown-guard
          $patch: delete
        - name: drbd-module-loader
          $patch: delete
      volumes:
        - name: run-systemd-system
          $patch: delete
        - name: run-drbd-shutdown-guard
          $patch: delete
        - name: systemd-bus-socket
          $patch: delete
        - name: lib-modules
          $patch: delete
        - name: usr-src
          $patch: delete
        - name: etc-lvm-backup
          hostPath:
            path: /var/etc/lvm/backup
            type: DirectoryOrCreate
        - name: etc-lvm-archive
          hostPath:
            path: /var/etc/lvm/archive
            type: DirectoryOrCreate
