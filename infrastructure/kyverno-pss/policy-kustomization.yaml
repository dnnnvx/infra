apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-pss
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: kyverno-policies
    namespace: flux-system
  path: ./pod-security/restricted
  prune: true
  wait: false
  dependsOn:
    - name: infrastructure
