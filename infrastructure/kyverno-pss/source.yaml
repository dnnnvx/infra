apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kyverno-policies
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/kyverno/policies
  ref:
    branch: main
  ignore: |
    # exclude ArtifactHub metadata — not valid Kubernetes resources
    **/artifacthub-pkg.yml
