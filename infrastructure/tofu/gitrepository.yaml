# The flux-system GitRepository excludes tofu/ (.sourceignore), so the controller gets its own.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: infra-tofu
  namespace: flux-system
spec:
  interval: 30m
  url: ssh://git@tangled.org/did:plc:mhpujlntihfhlixaayuearmr
  ref:
    branch: main
  secretRef:
    name: flux-system
  # appended after the repo's .sourceignore; infrastructure/ holds the Cilium/Flux values tofu reads
  ignore: |
    /*
    !/tofu/
    !/infrastructure/
