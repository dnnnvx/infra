apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot
  namespace: zot
spec:
  interval: 30m
  dependsOn:
    - name: cilium
      namespace: kube-system
  chart:
    spec:
      chart: zot
      version: 0.1.x
      sourceRef:
        kind: HelmRepository
        name: zot
        namespace: zot
      interval: 24h
  valuesFrom:
    - kind: ConfigMap
      name: zot-values
      valuesKey: values.yaml
      optional: true
