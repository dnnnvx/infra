apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tetragon
  namespace: kube-system
spec:
  suspend: true
  interval: 30m
  dependsOn:
    - name: cilium
      namespace: kube-system
  valuesFrom:
    - kind: ConfigMap
      name: tetragon-values
      valuesKey: values.yaml
      optional: true
  chart:
    spec:
      chart: tetragon
      version: 1.x
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
      interval: 24h
