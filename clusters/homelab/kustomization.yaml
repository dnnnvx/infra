apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - infrastructure.yaml
  - config.yaml
  - apps.yaml
  - policies.yaml

configMapGenerator:
  - name: cilium-values
    namespace: kube-system
    files:
      - values.yaml=values/cilium.yaml
    options:
      disableNameSuffixHash: true

  - name: flux-operator-values
    namespace: flux-system
    files:
      - values.yaml=values/flux-operator.yaml
    options:
      disableNameSuffixHash: true

  - name: flux-instance-values
    namespace: flux-system
    files:
      - values.yaml=values/flux-instance.yaml
    options:
      disableNameSuffixHash: true

  - name: metrics-server-values
    namespace: kube-system
    files:
      - values.yaml=values/metrics-server.yaml
    options:
      disableNameSuffixHash: true

  - name: cert-manager-values
    namespace: cert-manager
    files:
      - values.yaml=values/cert-manager.yaml
    options:
      disableNameSuffixHash: true

  - name: tetragon-values
    namespace: kube-system
    files:
      - values.yaml=values/tetragon.yaml
    options:
      disableNameSuffixHash: true

  - name: kyverno-values
    namespace: kyverno
    files:
      - values.yaml=values/kyverno.yaml
    options:
      disableNameSuffixHash: true

  - name: policy-reporter-values
    namespace: kyverno
    files:
      - values.yaml=values/policy-reporter.yaml
    options:
      disableNameSuffixHash: true
