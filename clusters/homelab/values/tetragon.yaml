tetragon:
  enableProcessCred: true
  enableProcessNs: true

  clusterName: homelab

  exportFilename: tetragon.log
  exportFilePerm: "640"

  exportDenyList: |
    {"health_check":true}
    {"namespace":["kube-system"],"binary_regex":["/bin/busybox"]}
    {"binary_regex":["/usr/bin/runc","/usr/bin/containerd.*"]}

  grpc:
    enabled: false

# Required for Talos Linux — grants access to the tracing filesystem
extraHostPathMounts:
  - name: sys-kernel-tracing
    mountPath: /sys/kernel/tracing

# Mount the forwarder script into the pod
extraVolumes:
  - name: telegram-forwarder-script
    configMap:
      name: tetragon-telegram-forwarder
      defaultMode: 0755

# Repurpose the built-in export-stdout sidecar as the Telegram forwarder.
# The chart doesn't support extraContainers; this is the only extensible sidecar slot.
export:
  mode: "stdout"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
  stdout:
    image:
      override: alpine:3.21
    enabledCommand: true
    commandOverride:
      - /bin/sh
    enabledArgs: true
    argsOverride:
      - -c
      - apk add --no-cache curl jq > /dev/null 2>&1 && exec /scripts/forward.sh
    extraEnv:
      - name: TELEGRAM_BOT_TOKEN
        valueFrom:
          secretKeyRef:
            name: tetragon-telegram
            key: bot_token
      - name: TELEGRAM_CHAT_ID
        valueFrom:
          secretKeyRef:
            name: tetragon-telegram
            key: chat_id
    extraVolumeMounts:
      - name: telegram-forwarder-script
        mountPath: /scripts
