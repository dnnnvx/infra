tetragon:
  enableProcessCred: true
  enableProcessNs: true

  clusterName: homelab

  exportFilename: tetragon.log
  exportFilePerm: "640"

  exportDenyList: |
    {"health_check":true}

  grpc:
    enabled: false

  # Mount the shared export emptyDir into the tetragon container
  extraVolumeMounts:
    - name: tetragon-export
      mountPath: /var/run/cilium/tetragon

# Required for Talos Linux — grants access to the tracing filesystem
extraHostPathMounts:
  - name: sys-kernel-tracing
    mountPath: /sys/kernel/tracing

extraVolumes:
  - name: tetragon-export
    emptyDir: {}
  - name: telegram-forwarder-script
    configMap:
      name: tetragon-telegram-forwarder
      defaultMode: 0755

extraContainers:
  - name: telegram-forwarder
    image: alpine:3.21
    command: ["/bin/sh", "-c"]
    args:
      - "apk add --no-cache curl jq > /dev/null 2>&1 && exec /scripts/forward.sh"
    env:
      - name: TELEGRAM_BOT_TOKEN
        valueFrom:
          secretKeyRef:
            name: tetragon-telegram
            key: bot_token
      - name: TELEGRAM_CHAT_ID
        valueFrom:
          secretKeyRef:
            name: tetragon-telegram
            key: chat_id
    volumeMounts:
      - name: tetragon-export
        mountPath: /var/run/cilium/tetragon
      - name: telegram-forwarder-script
        mountPath: /scripts
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
