provider:
  name: cloudflare

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: api-token

sources:
  - gateway-httproute

domainFilters:
  - casasulgorgo.net

# Identifies records owned by this cluster (prevents conflicts with other tools)
txtOwnerId: homelab

# sync: create and delete records to match cluster state
# upsert-only: only create/update, never delete (safer while testing)
policy: sync
