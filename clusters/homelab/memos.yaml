apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: memos
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: config
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/memos/overlays/homelab
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
