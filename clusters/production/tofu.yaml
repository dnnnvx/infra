apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tofu
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/tofu
  prune: false
  wait: true
  timeout: 15m
  # Terraform objects aren't kstatus-aware: count drift (Ready=False) and a plan waiting
  # for approval as failed, so the Kustomization's error alert reaches Matrix.
  healthCheckExprs:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
      failed: status.conditions.exists(e, e.type == 'Ready' && (e.status == 'False' || e.reason == 'TerraformPlannedWithChanges'))
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-substitutions
        optional: true
