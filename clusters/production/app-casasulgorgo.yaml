# Own Kustomization so the CI build can wait for this app's rollout without
# being failed by an unrelated unhealthy app in `apps` (see config/tekton flux-sync).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-casasulgorgo
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: config
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/casasulgorgo/overlays/production
  prune: false
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
