machine:
  install:
    disk: /dev/nvme0n1
  network:
    hostname: nuc-1
    interfaces:
      - deviceSelector:
          busPath: 0*
        dhcp: true
        vip:
          ip: 192.168.1.100
        addresses:
          - 192.168.1.101/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
  kubelet:
    nodeIP: 192.168.1.101
