# CI-built (components/ci-app): the flux-sync task waits for this Kustomization after each build.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-marcods
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: config
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/marcods
  prune: true
  wait: true
  # Fills components/ci-app (Trigger, image automation, flux-sync RBAC)
  postBuild:
    substitute:
      ci_project: marcods
      ci_image: web
  decryption:
    provider: sops
    secretRef:
      name: sops-age
