apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-kubbot
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: config
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/kubbot
  # No deletionPolicy: Orphan (unlike the other apps): removing this Kustomization deletes the
  # bot, including its PVC (the Matrix crypto store, re-created by logging in again).
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
