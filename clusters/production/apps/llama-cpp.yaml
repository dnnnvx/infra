apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-llama-cpp
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: config
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/llama-cpp
  prune: false
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
