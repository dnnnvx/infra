apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/cert-manager
  - ../base/cilium
  - ../base/flux
  - ../base/metrics-server
  - ../base/piraeus
configMapGenerator:
  - name: flux-instance-values
    namespace: flux-system
    files:
      - values.yaml=values/flux-instance.yaml
    options:
      disableNameSuffixHash: true
  - name: cilium-values
    namespace: kube-system
    files:
      - values.yaml=values/cilium.yaml
    options:
      disableNameSuffixHash: true
