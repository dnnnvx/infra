apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux
  namespace: flux-system
spec:
  interval: 30m
  dependsOn:
    - name: flux-operator
      namespace: flux-system
  chart:
    spec:
      chart: flux-instance
      version: 0.43.x
      sourceRef:
        kind: HelmRepository
        name: flux-operator
        namespace: flux-system
      interval: 24h
  valuesFrom:
    - kind: ConfigMap
      name: flux-instance-values
      valuesKey: values.yaml
