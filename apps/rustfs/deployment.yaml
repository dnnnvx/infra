# Single-node, single-drive RustFS (S3). Settings follow the upstream chart's standalone mode
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: rustfs
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/part-of: rustfs
spec:
  replicas: 1
  # RWO volume
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
        app.kubernetes.io/part-of: rustfs
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.6
          # Skip the image's entrypoint.sh (it prepares /logs and default dirs), like the chart does
          command: ["/usr/bin/rustfs"]
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: ":9001"
            # The image allows any origin
            - name: RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS
              value: https://rustfs.local.casasulgorgo.net
            - name: RUSTFS_REGION
              value: us-east-1
            # Empty: log to stdout only, no log volume
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: ""
            - name: RUSTFS_OBS_LOGGER_LEVEL
              value: info
            - name: RUSTFS_OBS_ENVIRONMENT
              value: production
          # RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY: root credentials, created by tofu (tofu/production/rustfs.tf)
          envFrom:
            - secretRef:
                name: rustfs-root
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: s3
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: s3
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: s3
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
