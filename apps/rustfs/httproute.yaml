# LAN-only (homelab-local Gateway, public *.local.casasulgorgo.net wildcard TLS): the S3 API for
# laptops and the web console. In-cluster clients use the Service directly
# (http://rustfs.rustfs.svc.cluster.local:9000), not these hostnames.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-s3
  namespace: rustfs
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |
      name: RustFS
      group: infrastructure
      url: https://s3.local.casasulgorgo.net/health
spec:
  parentRefs:
    - name: homelab-local
      namespace: kube-system
      sectionName: https
  hostnames:
    - s3.local.casasulgorgo.net
  rules:
    - backendRefs:
        - name: rustfs
          port: 9000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-console
  namespace: rustfs
spec:
  parentRefs:
    - name: homelab-local
      namespace: kube-system
      sectionName: https
  hostnames:
    - rustfs.local.casasulgorgo.net
  rules:
    - backendRefs:
        - name: rustfs
          port: 9001
