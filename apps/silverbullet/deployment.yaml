apiVersion: apps/v1
kind: Deployment
metadata:
  name: silverbullet
  namespace: silverbullet
  labels:
    app.kubernetes.io/part-of: silverbullet
  annotations:
    checkov.io/skip1: CKV_K8S_22=the entrypoint's PUID/PGID user setup isn't verified with a read-only root yet
    checkov.io/skip2: CKV_K8S_9=docs-sync sidecar has no readiness probe on purpose, a GitHub outage must not take the notes out of the Service
    checkov.io/skip3: CKV_K8S_8=docs-sync is a sleep loop with no endpoint to probe; failures are logged per repo and retried next period
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: silverbullet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: silverbullet
        app.kubernetes.io/part-of: silverbullet
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: silverbullet
          image: ghcr.io/silverbulletmd/silverbullet:2.12.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 512Mi
          env:
            # match the fsGroup so the entrypoint's owner-detection lands on our uid
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /.instance
              port: http
            initialDelaySeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /.instance
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 3
        # Public docs space (docs.marcods.dev): mirrors the repos listed in
        # docs-sync/repos into /data/spaces/docs/<folder>. Git is the source of
        # truth, nothing to back up. The git-sync image only provides bash + git;
        # docs-sync/sync.sh does the work, so one container serves every repo.
        - name: docs-sync
          image: registry.k8s.io/git-sync/git-sync:v4.8.0
          command: ["/bin/bash", "/config/sync.sh"]
          env:
            - name: PERIOD
              value: "120"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: docs-sync-config
              mountPath: /config
            # clones go in /git/<folder>, created by git as uid 1000: the
            # root-owned mount point itself would be "dubious ownership"
            - name: git
              mountPath: /git
            - name: tmp
              mountPath: /tmp
            # only the docs space, not the private notes. The space must exist
            # first (created in the dashboard), or kubelet creates it root-owned.
            - name: data
              mountPath: /space
              subPath: spaces/docs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: docs-sync-config
          configMap:
            name: docs-sync
        - name: git
          emptyDir: {}
        - name: tmp
          emptyDir: {}
