apiVersion: apps/v1
kind: Deployment
metadata:
  name: silverbullet
  namespace: silverbullet
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: silverbullet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: silverbullet
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: silverbullet
          image: ghcr.io/silverbulletmd/silverbullet:2.11.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: http
          env:
            # match the fsGroup so the entrypoint's owner-detection lands on our uid
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: data
              mountPath: /data
            # 2.11 still honours a /space mount and would stay in legacy
            # single-space mode. Park the old volume somewhere neutral so /data
            # is the only space root the server sees, then copy the contents
            # into the space folder the setup wizard creates.
            - name: space
              mountPath: /old-space
              readOnly: true
          livenessProbe:
            httpGet:
              path: /.instance
              port: http
            initialDelaySeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /.instance
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: space
          persistentVolumeClaim:
            claimName: space
