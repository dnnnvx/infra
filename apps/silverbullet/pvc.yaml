# Legacy single-space volume. Kept mounted read-only at /old-space until its
# contents have been copied into the multi-space data folder; then removed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: space
  namespace: silverbullet
  labels:
    app.kubernetes.io/part-of: silverbullet
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# Multi-space data root: server config, accounts, authentication.json and the
# spaces themselves.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: silverbullet
  labels:
    app.kubernetes.io/part-of: silverbullet
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
