apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: silverbullet
  namespace: silverbullet
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |
      name: Silverbullet
      path: /.instance
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: https-marcods-sub
    # TEMP: old hostname (LAN-only via AdGuard) to reach /.dashboard and change the primary URL; remove after
    - name: homelab
      namespace: kube-system
      sectionName: https
  hostnames:
    - notes.marcods.dev
    - notes.casasulgorgo.net
  rules:
    - backendRefs:
        - name: silverbullet
          port: 3000
