apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns
  namespace: ddns
  labels:
    app.kubernetes.io/part-of: cloudflare-ddns
  annotations:
    checkov.io/skip1: CKV_K8S_8=no listening port or health command to probe
    checkov.io/skip2: CKV_K8S_9=no listening port or health command to probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-ddns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflare-ddns
        app.kubernetes.io/part-of: cloudflare-ddns
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflare-ddns
          image: favonia/cloudflare-ddns:1.17.1
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          env:
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-token
                  key: api-token
            # apex + WireGuard endpoint (hostname kept out of git); set by tofu
            - name: DOMAINS
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-token
                  key: domains
            - name: CF_API_TOKEN
              value: ""
            # only the apex is proxied; the WireGuard endpoint must be DNS-only (UDP)
            - name: PROXIED
              value: "is(casasulgorgo.net)"
            - name: TTL
              value: "1"
            - name: UPDATE_CRON
              value: "@every 10m"
            - name: IP4_PROVIDER
              value: "cloudflare.trace"
            - name: IP6_PROVIDER
              value: "none"
            - name: UPDATE_ON_START
              value: "true"
            - name: DELETE_ON_STOP
              value: "false"
            - name: CACHE_EXPIRATION
              value: "6h0m0s"
            - name: DETECTION_TIMEOUT
              value: "10s"
            - name: UPDATE_TIMEOUT
              value: "30s"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
