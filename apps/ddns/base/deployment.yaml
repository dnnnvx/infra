apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns
  namespace: ddns
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-ddns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflare-ddns
    spec:
      containers:
        - name: cloudflare-ddns
          image: favonia/cloudflare-ddns:1.17.0
          env:
            - name: CF_API_TOKEN
              value: ""
            - name: DOMAINS
              value: "example.com"
            - name: PROXIED
              value: "false"
            - name: TTL
              value: "60"
            - name: UPDATE_CRON
              value: "@every 10m"
            - name: IP4_PROVIDER
              value: "cloudflare.trace"
            - name: IP6_PROVIDER
              value: "cloudflare.trace"
            - name: UPDATE_ON_START
              value: "true"
            - name: DELETE_ON_STOP
              value: "false"
            - name: CACHE_EXPIRATION
              value: "6h0m0s"
            - name: DETECTION_TIMEOUT
              value: "10s"
            - name: UPDATE_TIMEOUT
              value: "30s"
            - name: "IP6_PROVIDER"
              value: "none"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
