apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalwart
  namespace: mail
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stalwart
          image: stalwartlabs/stalwart:v0.15-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 25
              name: smtp
            - containerPort: 465
              name: smtps
            - containerPort: 993
              name: imaps
            - containerPort: 443
              name: https
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: data
              mountPath: /opt/stalwart
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stalwart-data
