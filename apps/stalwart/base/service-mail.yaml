apiVersion: v1
kind: Service
metadata:
  name: stalwart-mail
  namespace: mail
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: stalwart
  ports:
    - port: 25
      targetPort: smtp
      name: smtp
      protocol: TCP
    - port: 465
      targetPort: smtps
      name: smtps
      protocol: TCP
    - port: 993
      targetPort: imaps
      name: imaps
      protocol: TCP
    - port: 443
      targetPort: https
      name: https
      protocol: TCP
