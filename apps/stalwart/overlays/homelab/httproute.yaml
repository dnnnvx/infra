apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stalwart
  namespace: mail
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: http
  hostnames:
    - mail.home
  rules:
    - backendRefs:
        - name: stalwart
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stalwart-external
  namespace: mail
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: https
  hostnames:
    - mail.casasulgorgo.net
  rules:
    - backendRefs:
        - name: stalwart
          port: 8080
