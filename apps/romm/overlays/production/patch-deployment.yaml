apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm
  namespace: romm
spec:
  template:
    spec:
      containers:
        - name: romm
          env:
            - name: ROMM_BASE_URL
              value: https://romm.casasulgorgo.net
            # Served over HTTPS at the gateway, so the session/CSRF cookies can
            # be marked Secure (defaults to false upstream).
            - name: ROMM_SESSION_SECURE_COOKIE
              value: "true"
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_PROVIDER
              value: pocket-id
            - name: OIDC_SERVER_APPLICATION_URL
              value: https://auth.casasulgorgo.net
            - name: OIDC_SERVER_METADATA_URL
              value: https://auth.casasulgorgo.net/.well-known/openid-configuration
            - name: OIDC_REDIRECT_URI
              value: https://romm.casasulgorgo.net/api/oauth/openid
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: OIDC_CLIENT_SECRET
