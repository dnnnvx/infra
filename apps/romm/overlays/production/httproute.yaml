apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: romm
  namespace: romm
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |
      name: RomM
      conditions:
        - "[STATUS] < 500"
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: https
  hostnames:
    - romm.casasulgorgo.net
  rules:
    - backendRefs:
        - name: romm
          port: 8080
