# The RomM image runs its own valkey when REDIS_HOST is unset, snapshotting to
# /redis-data. Holds sessions and cached metadata only — rebuildable.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-redis
  namespace: romm
  labels:
    app.kubernetes.io/part-of: romm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: piraeus
