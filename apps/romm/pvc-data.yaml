# Single volume for the whole of /romm. RomM's image deliberately declares only
# the parent /romm as a VOLUME (not library/, resources/, assets/) so those stay
# on one filesystem — it hardlinks across them with os.link(), which fails with
# EXDEV if they land on separate mounts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-data
  namespace: romm
  labels:
    app.kubernetes.io/part-of: romm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
  # On `piraeus` (file-thin, placementCount 2) because `piraeus-hdd` no longer exists:
  # nuc-102 is back, but its HDD is now the system disk, with no LINSTOR pool
  # (lightnvr is still unschedulable).
  # Costs 40Gi raw for a 20Gi library; revisit if a bulk pool is added on nuc-102.
  storageClassName: piraeus
