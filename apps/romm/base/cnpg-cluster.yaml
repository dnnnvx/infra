apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: romm-postgres
  namespace: romm
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17-standard-trixie
  storage:
    size: 2Gi
    storageClass: piraeus
  bootstrap:
    initdb:
      database: romm
      owner: romm
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
