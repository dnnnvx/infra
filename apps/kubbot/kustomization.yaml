apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - ciliumnetworkpolicy.yaml
  - pvc.yaml
  # TODO: re-add once kubbot/bot is built and signed and the old store is copied into
  # kubbot-data. Kyverno rejects the Deployment (even at 0 replicas) while the digest below
  # doesn't exist, and that failed the whole apply, CI Trigger included.
  # - deployment.yaml
  - secrets.yaml
  - ci.yaml
images:
  # The digest is a placeholder until the first build; Flux rewrites it.
  - name: kubbot
    newName: registry.local.casasulgorgo.net/kubbot/bot
    newTag: production
    digest: sha256:449b7c0f4bc325e8b2bc31884c2db1500ed58218252a1b87f15433edcdc0c312 # {"$imagepolicy": "flux-system:kubbot:digest"}
