# Read-only. !ci and the CI alerts need the PipelineRuns, !tofu needs the one Terraform
# and its stored plan, the Kyverno alerts need the PolicyReports of every namespace, and it
# lists and watches the pods of every namespace.
# Approving a plan stays with a person running kubectl.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubbot
  namespace: kubbot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubbot-ci
  namespace: tekton-ci
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["list", "watch"]
  - apiGroups: ["tekton.dev"]
    resources: ["taskruns"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubbot-ci
  namespace: tekton-ci
subjects:
  - kind: ServiceAccount
    name: kubbot
    namespace: kubbot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubbot-ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubbot-tofu
  namespace: flux-system
rules:
  - apiGroups: ["infra.contrib.fluxcd.io"]
    resources: ["terraforms"]
    resourceNames: ["production"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["tfplan-default-production"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubbot-tofu
  namespace: flux-system
subjects:
  - kind: ServiceAccount
    name: kubbot
    namespace: kubbot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubbot-tofu
---
# Kyverno alerts: FAIL results from both Kyverno policies (written by Kyverno's reports controller)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubbot-policyreports
rules:
  - apiGroups: ["wgpolicyk8s.io"]
    resources: ["policyreports", "clusterpolicyreports"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubbot-policyreports
subjects:
  - kind: ServiceAccount
    name: kubbot
    namespace: kubbot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubbot-policyreports
---
# Pods of every namespace (list + watch only; no pods/log or exec outside tekton-ci)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubbot-pods
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubbot-pods
subjects:
  - kind: ServiceAccount
    name: kubbot
    namespace: kubbot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubbot-pods
