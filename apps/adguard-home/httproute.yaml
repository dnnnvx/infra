apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguard-home
  namespace: adguard-home
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: http
  hostnames:
    - adguard.home
  rules:
    - backendRefs:
        - name: adguard-home
          port: 3000
