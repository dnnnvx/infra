apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguard-home
  namespace: adguard-home
spec:
  parentRefs:
    - name: homelab-local
      namespace: kube-system
      sectionName: https
  hostnames:
    - adguard.local.casasulgorgo.net
  rules:
    - backendRefs:
        - name: adguard-home
          port: 3000
