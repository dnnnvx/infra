apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
  namespace: adguard-home
  labels:
    app.kubernetes.io/part-of: adguard-home
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
    # accept DNS queries from cluster pods/nodes
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # accept DNS queries from LAN clients via LoadBalancer (Cilium classifies as world)
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # web UI — allow all cluster pods (covers gatus monitoring + home-assistant via SNAT)
    # home-assistant uses hostNetwork so it SNATs through the node's CiliumInternalIP
    # which appears as remote-node; fromEntities:cluster covers this
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # upstream DNS resolvers and DoH/DoT
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
            - port: "853"
              protocol: TCP
            - port: "443"
              protocol: TCP
