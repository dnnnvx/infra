apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: adguard-home
  namespace: adguard-home
spec:
  volumeClaimTemplates:
    - metadata:
        name: conf
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: piraeus
        resources:
          requests:
            storage: 100Mi
    - metadata:
        name: work
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: piraeus
        resources:
          requests:
            storage: 512Mi
