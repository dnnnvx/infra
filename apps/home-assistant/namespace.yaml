apiVersion: v1
kind: Namespace
metadata:
  name: home-assistant
  annotations:
    # kept when the app is removed (deleting it would delete the data): delete by hand
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # hostNetwork: true (needed for mDNS/SSDP device discovery) requires
    # privileged PodSecurity level — baseline blocks host namespaces
    pod-security.kubernetes.io/enforce: privileged
    app.kubernetes.io/part-of: home-assistant
