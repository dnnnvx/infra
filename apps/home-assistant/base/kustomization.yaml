apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - matter-server-pvc.yaml
  - matter-server-service.yaml
  - matter-server-deployment.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: home-assistant
    includeSelectors: false
    includeTemplates: true

configMapGenerator:
  - name: home-assistant-config
    namespace: home-assistant
    files:
      - configuration.yaml
