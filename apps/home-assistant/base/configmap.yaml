apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: home-assistant
data:
  configuration.yaml: |
    homeassistant:
      name: Home
      unit_system: metric
      time_zone: Europe/Rome
    default_config:
    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.0.0.0/8
