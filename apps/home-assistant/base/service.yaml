apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: home-assistant
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      # HA's UI is websocket-driven
      appProtocol: kubernetes.io/ws
