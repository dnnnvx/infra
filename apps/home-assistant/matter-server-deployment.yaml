apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  namespace: home-assistant
  labels:
    app.kubernetes.io/part-of: home-assistant
  # Matter over Thread/Wi-Fi needs the host's IPv6 networking and Bluetooth (commissioning), hence privileged + hostNetwork
  annotations:
    checkov.io/skip1: CKV_K8S_16=privileged for host IPv6 routing and Bluetooth
    checkov.io/skip2: CKV_K8S_19=Matter multicast and IPv6 need the host network
    checkov.io/skip3: CKV_K8S_20=privileged
    checkov.io/skip4: CKV_K8S_23=privileged
    checkov.io/skip5: CKV_K8S_28=privileged
    checkov.io/skip6: CKV_K8S_37=privileged
    checkov.io/skip7: CKV_K8S_22=privileged
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: matter-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matter-server
        app.kubernetes.io/part-of: home-assistant
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: matter-server
          image: ghcr.io/home-assistant-libs/python-matter-server:8.1.0
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          # websocket API used by Home Assistant
          livenessProbe:
            tcpSocket:
              port: 5580
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 5580
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: matter-server-data
