apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      # Without `sectionName`, a route attaches to *all* matching listeners.
      # `ha.home` should only be on HTTP (port 80), so we pinned it explicitly
      sectionName: http
  hostnames:
    - ha.home
  rules:
    - backendRefs:
        - name: home-assistant
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant-external
  namespace: home-assistant
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |
      name: Home Assistant
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: https
  hostnames:
    - ha.casasulgorgo.net
  rules:
    - backendRefs:
        - name: home-assistant
          port: 80
