apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      # Without `sectionName`, a route attaches to *all* matching listeners.
      # `ha.homelab` should only be on HTTP (port 80), so we pinned it explicitly
      sectionName: http
  hostnames:
    - ha.homelab
  rules:
    - backendRefs:
        - name: home-assistant
          port: 8123
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant-external
  namespace: home-assistant
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: https
  hostnames:
    - ha.casasulgorgo.net
  rules:
    # Redirect the root to the OIDC entry point so users land on the passkey
    # login flow instead of the standard HA login page. Only the exact root is
    # redirected — all other paths (including /auth/oidc/callback, API, etc.)
    # go directly to HA so code login and app connections still work.
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /auth/oidc/redirect
            statusCode: 302
    - backendRefs:
        - name: home-assistant
          port: 8123
