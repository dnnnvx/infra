apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
  namespace: home-assistant
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: gatus
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # home-assistant needs LAN device access and external integrations
    - toEntities:
        - world
        - host
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: adguard-home
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
