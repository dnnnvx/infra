alerting:
  telegram:
    token: ${TELEGRAM_TOKEN}
    id: ${TELEGRAM_CHAT_ID}

endpoints:
  - name: Kubernetes API
    group: infrastructure
    url: https://192.168.0.100:6443
    client:
      insecure: true
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: telegram
        send-on-resolved: true
