alerting:
  telegram:
    token: ${TELEGRAM_TOKEN}
    id: ${TELEGRAM_CHAT_ID}

endpoints:
  - name: Home Assistant
    group: apps
    url: http://home-assistant.home-assistant.svc.cluster.local:8123
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram
        send-on-resolved: true

  - name: Home Assistant (external)
    group: apps
    url: https://ha.casasulgorgo.net
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram
        send-on-resolved: true

  - name: AdGuard Home
    group: apps
