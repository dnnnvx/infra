apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - httproute.yaml
  - secrets.yaml
  - networkpolicy.yaml
patches:
  - path: patch-deployment.yaml

configMapGenerator:
  - name: gatus-config
    namespace: gatus
    files:
      - config.yaml
    options:
      disableNameSuffixHash: true
