apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - rbac.yaml
  - ciliumnetworkpolicy.yaml
  - httproute.yaml
  - secrets.yaml
configMapGenerator:
  - name: gatus-config
    namespace: gatus
    files:
      - config.yaml
    options:
      disableNameSuffixHash: true
