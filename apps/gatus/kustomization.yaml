apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - rbac.yaml
  - ciliumnetworkpolicy.yaml
  - httproute.yaml
  - secrets.yaml
# hashed name: config.yaml is a subPath mount (never updated in place), so a config
# change must roll the pod
configMapGenerator:
  - name: gatus-config
    namespace: gatus
    files:
      - config.yaml
