apiVersion: v1
kind: ServiceAccount
metadata:
  name: gatus
  namespace: gatus
---
# gatus-sidecar: read HTTPRoutes and their parent Gateways (annotation inheritance)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gatus-sidecar
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "gateways"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gatus-sidecar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gatus-sidecar
subjects:
  - kind: ServiceAccount
    name: gatus
    namespace: gatus
