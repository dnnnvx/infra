apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/directus
  - ../base/postgresql
  - ../base/vm-stack
commonLabels:
  ilposto.studio/stage: production
patches:
  - path: directus.yaml
    target:
      kind: HelmRelease
      name: directus
  - path: postgresql.yaml
    target:
      kind: HelmRelease
      name: postgresql
