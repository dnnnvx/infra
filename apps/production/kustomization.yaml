apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/directus
  - ../base/postgresql
commonLabels:
  ilposto.studio/stage: production
patches:
  - path: release-directus.yaml
    target:
      kind: HelmRelease
      name: directus
  - path: release-postgresql.yaml
    target:
      kind: HelmRelease
      name: postgresql
