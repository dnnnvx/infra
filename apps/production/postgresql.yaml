apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: postgresql
spec:
  interval: 5m
  chart:
    spec:
      chart: cloudnative-pg
      version: '>=0.20.1'
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: postgresql
      interval: 1m
  values:
    replicaCount: 1
    crds:
      create: true
    config:
      create: true
    resources:
      limits:
        cpu: 100m
        memory: 200Mi
      requests:
        cpu: 50m
        memory: 8Mi
    monitoring:
      podMonitorEnabled: false
