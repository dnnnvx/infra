apiVersion: apps/v1
kind: Deployment
metadata:
  name: calyx-frontend
  namespace: calyx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: calyx-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calyx-frontend
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: calyx-frontend
          image: ghcr.io/stefexec/calyx-frontend:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
