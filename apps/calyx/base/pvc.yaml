apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calyx-data
  namespace: calyx
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calyx-uploads
  namespace: calyx
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
