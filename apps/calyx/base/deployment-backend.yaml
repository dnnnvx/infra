apiVersion: apps/v1
kind: Deployment
metadata:
  name: calyx-backend
  namespace: calyx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: calyx-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calyx-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: calyx-backend
          image: ghcr.io/stefexec/calyx-backend:v1.2.3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              value: sqlite:////app/data/calyx.db
            - name: ENVIRONMENT
              value: production
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: calyx-data
        - name: uploads
          persistentVolumeClaim:
            claimName: calyx-uploads
