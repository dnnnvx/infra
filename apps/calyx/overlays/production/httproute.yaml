apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: calyx
  namespace: calyx
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: https
  hostnames:
    - calyx.casasulgorgo.net
  rules:
    - backendRefs:
        - name: calyx-frontend
          port: 80
