apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: vm-stack
  namespace: metrics
spec:
  interval: 5m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: '>=0.19.1'
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: metrics
      interval: 1m
  values:
    grafana:
      enabled: true
      sidecar:
        datasources:
          enabled: true
          initDatasources: true
          createVMReplicasDatasources: false
        dashboards:
          additionalDashboardLabels: {}
          additionalDashboardAnnotations: {}
          enabled: true
          multicluster: false
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: default
              orgId: 1
              folder: ""
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
      dashboards:
        default:
          nodeexporter:
            gnetId: 1860
            revision: 22
            datasource: VictoriaMetrics
      # you can use `victoriametrics-datasource` instead of `prometheus` if enabled VictoriaMetrics Datasource above
      defaultDatasourceType: prometheus
      grafana.ini:
        analytics:
          check_for_updates: false
        users:
          allow_sign_up: false
          allow_org_create: false
          viewers_can_edit: true
        auth:
          disable_login_form: true
          disable_signout_menu: true
        auth.basic:
          enabled: false
        auth.anonymous:
          enabled: true
          org_role: Editor
      defaultDashboardsEnabled: true
      defaultDashboardsTimezone: Europe/Rome
      defaultDashboardsEditable: true
      service:
        enabled: true
        type: ClusterIP
        annotations:
          external-dns.alpha.kubernetes.io/internal-hostname: grafana.ilposto.studio
      ingress:
        enabled: false
      resources:
        limits:
          cpu: 100m
          memory: 200Mi
      persistence:
        enabled: false
        storageClassName: local
        accessModes:
          - ReadWriteOnce
        inMemory:
          enabled: true
          sizeLimit: 200Mi
        size: 1Gi
    victoria-metrics-operator:
      enabled: true
      cleanupCRD: true
      createCRD: false # we disable crd creation by operator chart as we create them in this chart
      operator:
        # -- By default, operator converts prometheus-operator objects.
        disable_prometheus_converter: true
    defaultRules:
      create: true
      rules:
        etcd: true
        general: true
        k8s: true
        kubeApiserver: true
        kubeApiserverAvailability: true
        kubeApiserverBurnrate: true
        kubeApiserverHistogram: true
        kubeApiserverSlos: true
        kubelet: true
        kubePrometheusGeneral: true
        kubePrometheusNodeRecording: true
        kubernetesApps: true
        kubernetesResources: true
        kubernetesStorage: true
        kubernetesSystem: true
        kubeScheduler: true
        kubeStateMetrics: true
        network: true
        node: true
        vmagent: true
        vmsingle: true
        vmcluster: true
        vmhealth: true
        alertmanager: true
      ## Reduce app namespace alert scope
      appNamespacesTarget: .*
    grafanaOperatorDashboardsFormat:
      enabled: false
    vmsingle:
      enabled: true
      spec:
        retentionPeriod: "3"
        replicaCount: 1
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 4Gi
    alertmanager:
      enabled: true
      config:
        global:
          resolve_timeout: 5m
        route:
          receiver: telegram
          routes:
            - matchers:
                - severity=~"info|warning|critical"
              receiver: telegram
              continue: true
        receivers:
          - name: telegram
            telegram_configs:
              - send_resolved: true
                # message: '{{ template "slack.monzo.title" . }}: {{ template "slack.monzo.text" . }}'
                bot_token: 7170271606:AAGqLjFOzdlCITYPzR64pKbyifXHsNd-k_g
                chat_id: -1002052897951
      monzoTemplate:
        enabled: true
    vmalert:
      enabled: true
    vmagent:
      enabled: true
    prometheus-node-exporter:
      enabled: true
    kube-state-metrics:
      enabled: true
    kubelet:
      enabled: true
      cadvisor: true
      probes: true
    kubeApiServer:
      enabled: true
    kubeControllerManager:
      enabled: true
    kubeDns:
      enabled: false
    coreDns:
      enabled: true
    kubeEtcd:
      enabled: true
    kubeScheduler:
      enabled: true
    kubeProxy:
      enabled: false
    crds:
      enabled: true
