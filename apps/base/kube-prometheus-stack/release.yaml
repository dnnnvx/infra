apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: telemetry
spec:
  interval: 5m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: '>=56.9.0'
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: telemetry
      interval: 1m
  values:
    kube-prometheus-stack:
      crds:
        enabled: true
      defaultRules:
        rules:
          etcd: true
          kubeControllerManager: true
          kubeSchedulerAlerting: true
          kubeSchedulerRecording: true
          windows: false
      alertmanager:
        enabled: true
        ingress:
          enabled: false
        config:
          route:
            group_by:
              - alertname
              - job
            receiver: discord_devops
            routes:
              - receiver: "null"
                matchers:
                  - alertname =~ "InfoInhibitor|Watchdog"
              - receiver: discord_devops
                matchers:
                  - severity =~ "critical|error|warning|info"
          receivers:
            - name: "null"
            - name: discord_backend
              discord_configs:
                - webhook_url: https://discord.com/api/webhooks/abcd
                  send_resolved: true
                  title: '{{ template "slack.title" . }}'
                  message: '{{ template "slack.text" . }}'
      grafana:
        enabled: true
        grafana.ini:
          analytics:
            check_for_updates: false
          users:
            allow_sign_up: false
            allow_org_create: false
            viewers_can_edit: true
          auth:
            disable_login_form: true
            disable_signout_menu: true
          auth.basic:
            enabled: false
          auth.anonymous:
            enabled: true
            org_name: ilposto
            org_role: Editor
        defaultDashboardsEnabled: true
        defaultDashboardsTimezone: Europe/Rome
        defaultDashboardsEditable: true
        service:
          annotations:
            external-dns.alpha.kubernetes.io/internal-hostname: grafana.ilposto.studio
        ingress:
          enabled: false
        resources:
          limits:
            cpu: 100m
            memory: 200Mi
        persistence:
          enabled: false
          storageClassName: local
          accessModes:
            - ReadWriteOnce
          inMemory:
            enabled: true
            sizeLimit: 200Mi
          size: 1Gi
      kubeApiServer:
        enabled: true
      kubelet:
        enabled: true
      kubeControllerManager:
        enabled: true
      coreDns:
        enabled: true
      kubeDns:
        enabled: true
      kubeEtcd:
        enabled: true
      kubeScheduler:
        enabled: true
      kubeProxy:
        # set ConfigMap kube-proxy-config (kube-system ns): metricsBindAddress: 0.0.0.0:10249
        enabled: true
      kubeStateMetrics:
        enabled: true
      prometheus:
        enabled: true
        prometheusSpec:
          podMonitorSelectorNilUsesHelmValues: false
          serviceMonitorSelectorNilUsesHelmValues: false
          ruleSelectorNilUsesHelmValues: false
          resources:
            limits:
              cpu: 600mi
              memory: 1Gi
              ephemeral-storage: 8Gi
            requests:
              memory: 128Mi
              # storageSpec:
            # volumeClaimTemplate:
            # spec:
            # storageClassName: local
            # accessModes: ["ReadWriteOnce"]
            # resources:
            # requests:
            # storage: 16Gi
          retention: 3d
      cleanPrometheusOperatorObjectNames: true
