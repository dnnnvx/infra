apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: teable
  namespace: teable
spec:
  interval: 5m
  chart:
    spec:
      chart: ./apps/base/teable/chart
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m
      reconcileStrategy: Revision
  values: {}
