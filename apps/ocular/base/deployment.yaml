apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocular
  namespace: ocular
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ocular
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ocular
    spec:
      containers:
        - name: ocular
          image: ghcr.io/simonwep/ocular:v2
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: data
              mountPath: /data/genesis
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ocular-data
