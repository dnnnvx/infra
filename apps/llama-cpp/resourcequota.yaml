apiVersion: v1
kind: ResourceQuota
metadata:
  name: llama-cpp
  namespace: llama-cpp
  labels:
    app.kubernetes.io/part-of: llama-cpp
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 3Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: llama-cpp
  namespace: llama-cpp
  labels:
    app.kubernetes.io/part-of: llama-cpp
spec:
  limits:
    - type: Container
      default:
        cpu: "4"
        memory: 4Gi
      defaultRequest:
        cpu: 250m
        memory: 512Mi
