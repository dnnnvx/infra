apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  namespace: llama-cpp
  labels:
    app.kubernetes.io/part-of: llama-cpp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-cpp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-cpp
        app.kubernetes.io/part-of: llama-cpp
    spec:
      # CPU-only inference: pin to the i3-7100U (most capable node)
      nodeSelector:
        kubernetes.io/hostname: nuc-102
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llama-cpp
          image: ghcr.io/ggml-org/llama.cpp:server-b5350
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            # Tiny instruct model, auto-downloaded from HuggingFace on first start
            # (cached to the PVC via LLAMA_CACHE). Swap the repo to try others, e.g.
            # ggml-org/gemma-3-1b-it-GGUF or bartowski/Llama-3.2-1B-Instruct-GGUF.
            - -hf
            - bartowski/Qwen2.5-3B-Instruct-GGUF:Q4_K_M
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - -c
            - "4096"
            - -t
            - "4"
          env:
            - name: LLAMA_CACHE
              value: /models
          ports:
            - containerPort: 8080
              name: http
          # First start downloads the model — give it generous startup time
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-models
