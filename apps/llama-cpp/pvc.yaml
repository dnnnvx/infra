apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-models
  namespace: llama-cpp
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/part-of: llama-cpp
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: piraeus
  resources:
    requests:
      storage: 5Gi
