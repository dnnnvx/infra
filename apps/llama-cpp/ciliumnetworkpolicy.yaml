# llama-cpp is NOT publicly exposed — only oauth2-proxy (and gatus) may reach it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llama-cpp
  namespace: llama-cpp
  labels:
    app.kubernetes.io/part-of: llama-cpp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: llama-cpp
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: oauth2-proxy
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: gatus
    # norish calls the OpenAI-compatible API directly (server-to-server, no auth proxy)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: norish
            app.kubernetes.io/name: norish
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # HuggingFace model download
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# oauth2-proxy is the public entry point (gateway → :4180), authenticates against
# pocket-id (auth.casasulgorgo.net) and proxies to llama-cpp.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: oauth2-proxy
  namespace: llama-cpp
  labels:
    app.kubernetes.io/part-of: llama-cpp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  ingress:
    - fromEntities:
        - ingress
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: gatus
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # upstream + pocket-id OIDC reached via the gateway hairpin (both in-cluster)
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # auth.casasulgorgo.net resolves to the gateway LB IP (world-classified) + any
    # external OIDC fetch
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
