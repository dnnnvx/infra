apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
  namespace: memos
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: gatus
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: memos
    # CNPG operator scrapes instance status
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-system
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # in-namespace: memos → CNPG postgres rw service
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: memos
    # CNPG instance-manager (in the postgres pod) reports status to the apiserver
    - toEntities:
        - kube-apiserver
    # pocket-id OIDC (auth.casasulgorgo.net → gateway LB, world-classified)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
