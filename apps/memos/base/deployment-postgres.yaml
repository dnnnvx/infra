apiVersion: apps/v1
kind: Deployment
metadata:
  name: memos-postgres
  namespace: memos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memos-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memos-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: memos
            - name: POSTGRES_USER
              value: memos
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: memos-secrets
                  key: postgres-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: memos-postgres-data
