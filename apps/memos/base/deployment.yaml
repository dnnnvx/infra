apiVersion: apps/v1
kind: Deployment
metadata:
  name: memos
  namespace: memos
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: memos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memos
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: memos
          image: neosmemo/memos:0.29.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5230
              name: http
          env:
            - name: MEMOS_PORT
              value: "5230"
            - name: MEMOS_DRIVER
              value: postgres
            # CNPG auto-generates the <cluster>-app secret; `uri` is a ready DSN
            - name: MEMOS_DSN
              valueFrom:
                secretKeyRef:
                  name: memos-postgres-app
                  key: uri
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
