apiVersion: apps/v1
kind: Deployment
metadata:
  name: diun
  namespace: diun
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: diun
  template:
    metadata:
      labels:
        app.kubernetes.io/name: diun
    spec:
      serviceAccountName: diun
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: diun
          image: crazymax/diun:4.28.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: TZ
              value: Europe/Rome
            - name: DIUN_PROVIDERS_KUBERNETES
              value: "true"
            - name: DIUN_PROVIDERS_KUBERNETES_WATCHBYDEFAULT
              value: "true"
            - name: DIUN_WATCH_SCHEDULE
              value: "0 9 * * 1"
            - name: DIUN_WATCH_JITTER
              value: 30s
            - name: DIUN_NOTIF_TELEGRAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: diun-secrets
                  key: telegram-token
            - name: DIUN_NOTIF_TELEGRAM_CHATIDS
              valueFrom:
                secretKeyRef:
                  name: diun-secrets
                  key: telegram-chat-id
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: diun-data
