apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth2-proxy
  namespace: webauth
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: https
  hostnames:
    - oauth.casasulgorgo.net
  rules:
    - backendRefs:
        - name: oauth2-proxy
          port: 4180
