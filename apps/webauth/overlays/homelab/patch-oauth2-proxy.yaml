apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: webauth
spec:
  template:
    spec:
      # Override DNS for casasulgorgo.net subdomains to resolve directly to the
      # Gateway IP, bypassing Cloudflare. Without this, pods trying to reach
      # auth.casasulgorgo.net go out to the internet, hit Cloudflare, which then
      # tries to reach back into the home network — NAT hairpinning fails (521).
      hostAliases:
        - ip: "192.168.0.200"
          hostnames:
            - auth.casasulgorgo.net
            - oauth.casasulgorgo.net
      containers:
        - name: oauth2-proxy
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://auth.casasulgorgo.net
            - --http-address=0.0.0.0:4180
            - --redirect-url=https://oauth.casasulgorgo.net/oauth2/callback
            - --cookie-secure=true
            - --cookie-domain=.casasulgorgo.net
            - --email-domain=*
            - --reverse-proxy=true
            - --whitelist-domain=.casasulgorgo.net
            # In forward-auth (ext_authz) mode, OAuth2 Proxy is not the HTTP proxy —
            # Cilium's Gateway does the actual proxying to backends. OAuth2 Proxy only
            # validates auth on the /oauth2/auth endpoint and returns 200 (pass) or
            # 401/302 (redirect to login). static://202 is a built-in no-op upstream
            # that satisfies the required --upstream flag without proxying any traffic.
            - --upstream=static://202
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: cookie-secret
