apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: webauth
spec:
  template:
    spec:
      containers:
        - name: oauth2-proxy
          args:
            - --provider=oidc
            # Issuer URL used only to validate the `iss` claim in ID tokens.
            # No HTTP request is made to this URL at startup.
            - --oidc-issuer-url=https://auth.casasulgorgo.net
            - --http-address=0.0.0.0:4180
            - --redirect-url=https://oauth.casasulgorgo.net/oauth2/callback
            - --cookie-secure=true
            - --cookie-domain=.casasulgorgo.net
            - --email-domain=*
            - --reverse-proxy=true
            - --whitelist-domain=.casasulgorgo.net
            # Skip automatic OIDC discovery (which would require reaching auth.casasulgorgo.net
            # from inside the cluster — impossible due to Cilium blocking pod→LoadBalancer IP
            # connections). Instead, point each endpoint directly at the internal Pocket-ID
            # service over HTTP, avoiding the Gateway and Cloudflare entirely.
            - --skip-oidc-discovery=true
            - --login-url=https://auth.casasulgorgo.net/authorize
            - --redeem-url=http://pocket-id.webauth.svc.cluster.local:1411/api/oidc/token
            - --oidc-jwks-url=http://pocket-id.webauth.svc.cluster.local:1411/.well-known/jwks.json
            # In forward-auth (ext_authz) mode, OAuth2 Proxy is not the HTTP proxy —
            # Cilium's Gateway does the actual proxying to backends. OAuth2 Proxy only
            # validates auth on the /oauth2/auth endpoint and returns 200 (pass) or
            # 401/302 (redirect to login). static://202 is a built-in no-op upstream
            # that satisfies the required --upstream flag without proxying any traffic.
            - --upstream=static://202
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: cookie-secret
