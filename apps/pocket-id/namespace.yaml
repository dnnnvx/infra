apiVersion: v1
kind: Namespace
metadata:
  name: webauth
  annotations:
    # kept when the app is removed (deleting it would delete the data): delete by hand
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    app.kubernetes.io/part-of: webauth
