apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pocket-id
  namespace: webauth
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: https
  hostnames:
    - auth.casasulgorgo.net
  rules:
    - backendRefs:
        - name: pocket-id
          port: 1411
