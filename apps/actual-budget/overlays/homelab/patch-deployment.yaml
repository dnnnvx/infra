apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual-budget
  namespace: actual-budget
spec:
  template:
    spec:
      containers:
        - name: actual-budget
          env:
            - name: ACTUAL_OPENID_DISCOVERY_URL
              value: https://auth.casasulgorgo.net/.well-known/openid-configuration
            - name: ACTUAL_OPENID_SERVER_HOSTNAME
              value: https://budget.casasulgorgo.net
            - name: ACTUAL_OPENID_ENFORCE
              value: "true"
            - name: ACTUAL_USER_CREATION_MODE
              value: login
            - name: ACTUAL_OPENID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: actual-budget-oidc
                  key: ACTUAL_OPENID_CLIENT_ID
            - name: ACTUAL_OPENID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: actual-budget-oidc
                  key: ACTUAL_OPENID_CLIENT_SECRET
