apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
  namespace: birdnet-go
  labels:
    app.kubernetes.io/part-of: birdnet-go
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # rpi-1 mic (RTSP over TCP)
    - toCIDR:
        - 192.168.0.111/32
      toPorts:
        - ports:
            - port: "8554"
              protocol: TCP
    # species images, weather, model downloads
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
