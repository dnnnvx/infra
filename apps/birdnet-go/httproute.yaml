# LAN only: no auth configured in the app
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: birdnet-go
  namespace: birdnet-go
spec:
  parentRefs:
    - name: homelab-local
      namespace: kube-system
      sectionName: https
  hostnames:
    - birdnet.local.casasulgorgo.net
  rules:
    - backendRefs:
        - name: birdnet-go
          port: 8080
