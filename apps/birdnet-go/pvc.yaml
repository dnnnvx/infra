apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: birdnet-go-config
  namespace: birdnet-go
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/part-of: birdnet-go
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: piraeus
---
# detections DB + audio clips; the entrypoint refuses to start with < 1 GiB free here
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: birdnet-go-data
  namespace: birdnet-go
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/part-of: birdnet-go
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: piraeus
