apiVersion: apps/v1
kind: Deployment
metadata:
  name: jotty
  namespace: jotty
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jotty
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jotty
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jotty
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          image: ghcr.io/fccview/jotty:1.21.1
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: SSO_MODE
              value: oidc
            - name: INTERNAL_API_URL
              value: http://localhost:3000
          envFrom:
            - secretRef:
                name: jotty-oidc
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: config
              mountPath: /app/config
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: config
          persistentVolumeClaim:
            claimName: config
