apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lightnvr
  namespace: lightnvr
spec:
  parentRefs:
    - name: homelab-local
      namespace: kube-system
      sectionName: https
  hostnames:
    - nvr.local.casasulgorgo.net
  rules:
    - backendRefs:
        - name: lightnvr
          port: 8080
