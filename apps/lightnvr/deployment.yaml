apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightnvr
  namespace: lightnvr
  labels:
    app.kubernetes.io/part-of: lightnvr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lightnvr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lightnvr
        app.kubernetes.io/part-of: lightnvr
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lightnvr
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          image: ghcr.io/opensensor/lightnvr:0.43.4
          ports:
            - containerPort: 8080
              name: http
