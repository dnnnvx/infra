apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightnvr
  namespace: lightnvr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lightnvr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lightnvr
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lightnvr
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          image: ghcr.io/opensensor/lightnvr:0.35.1
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/lightnvr/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lightnvr-data
