apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
  namespace: lightnvr
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: gatus
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # RTSP streams from cameras (LAN + external)
    - toEntities:
        - world
        - host
      toPorts:
        - ports:
            - port: "554"
              protocol: TCP
            - port: "554"
              protocol: UDP
            - port: "8554"
              protocol: TCP
