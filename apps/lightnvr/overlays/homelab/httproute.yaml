apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lightnvr
  namespace: lightnvr
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: http
  hostnames:
    - nvr.home
  rules:
    - backendRefs:
        - name: lightnvr
          port: 8080
