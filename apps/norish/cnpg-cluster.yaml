apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: norish-postgres
  namespace: norish
  labels:
    app.kubernetes.io/part-of: norish
spec:
  instances: 1
  storage:
    size: 2Gi
    storageClass: piraeus
  bootstrap:
    initdb:
      database: norish
      owner: norish
      postInitApplicationSQL:
        - CREATE SCHEMA IF NOT EXISTS drizzle
        - ALTER SCHEMA drizzle OWNER TO norish
        - GRANT ALL ON ALL TABLES IN SCHEMA public TO norish
        - GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO norish
        - GRANT ALL ON ALL TABLES IN SCHEMA drizzle TO norish
        - GRANT ALL ON ALL SEQUENCES IN SCHEMA drizzle TO norish
        - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO norish
        - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO norish
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
