apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: norish-postgres
  namespace: norish
spec:
  instances: 1
  storage:
    size: 2Gi
    storageClass: piraeus
  bootstrap:
    initdb:
      database: norish
      owner: norish
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
