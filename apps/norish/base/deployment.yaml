apiVersion: apps/v1
kind: Deployment
metadata:
  name: norish
  namespace: norish
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: norish
  template:
    metadata:
      labels:
        app.kubernetes.io/name: norish
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: norish
          image: norishapp/norish:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: norish-secrets
                  key: database-url
            - name: REDIS_URL
              value: redis://valkey.valkey:6379
            - name: CHROME_WS_ENDPOINT
              value: ws://localhost:9222
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: norish-secrets
                  key: master-key
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
        - name: chrome-headless
          image: zenika/alpine-chrome:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - "--no-sandbox"
            - "--disable-gpu"
            - "--disable-dev-shm-usage"
            - "--disable-features=dbus"
            - "--remote-debugging-address=0.0.0.0"
            - "--remote-debugging-port=9222"
            - "--headless"
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: norish-uploads
