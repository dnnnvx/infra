apiVersion: apps/v1
kind: Deployment
metadata:
  name: norish
  namespace: norish
  labels:
    app.kubernetes.io/part-of: norish
  annotations:
    checkov.io/skip1: CKV_K8S_22=Next.js server and headless browser, their writable paths aren't mapped yet
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: norish
  template:
    metadata:
      labels:
        app.kubernetes.io/name: norish
        app.kubernetes.io/part-of: norish
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: norish
          image: norishapp/norish:v0.25.1-beta
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              memory: 1536Mi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          env:
            - name: AUTH_URL
              value: https://recipes.casasulgorgo.net
            - name: OIDC_NAME
              value: "Casa sul Gorgo"
            - name: OIDC_ISSUER
              value: https://auth.casasulgorgo.net
            - name: OIDC_WELLKNOWN
              value: https://auth.casasulgorgo.net/.well-known/openid-configuration
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: norish-secrets
                  key: oidc-client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: norish-secrets
                  key: oidc-client-secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: norish-postgres-app
                  key: uri
            - name: REDIS_URL
              value: redis://valkey.norish:6379
            - name: OBSCURA_ENDPOINT
              value: ws://localhost:9222
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: norish-secrets
                  key: master-key
            - name: OBSCURA_CDP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: norish-secrets
                  key: obscura-cdp-token
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
        - name: obscura
          image: norishapp/obscura:0.2.4-norish.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: OBSCURA_CDP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: norish-secrets
                  key: obscura-cdp-token
          ports:
            - containerPort: 9222
              name: cdp
          livenessProbe:
            tcpSocket:
              port: cdp
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: cdp
            periodSeconds: 10
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: norish-uploads
