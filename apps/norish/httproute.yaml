apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: norish
  namespace: norish
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |
      name: Norish
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: https
  hostnames:
    - recipes.casasulgorgo.net
  rules:
    - backendRefs:
        - name: norish
          port: 3000
