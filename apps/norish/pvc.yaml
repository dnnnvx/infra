apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: norish-uploads
  namespace: norish
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/part-of: norish
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: piraeus
