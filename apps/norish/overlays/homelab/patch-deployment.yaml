apiVersion: apps/v1
kind: Deployment
metadata:
  name: norish
  namespace: norish
spec:
  template:
    spec:
      containers:
        - name: norish
          env:
            - name: AUTH_URL
              value: https://recipes.casasulgorgo.net
            - name: OIDC_NAME
              value: Pocket-ID
            - name: OIDC_ISSUER
              value: https://auth.casasulgorgo.net
            - name: OIDC_WELLKNOWN
              value: https://auth.casasulgorgo.net/.well-known/openid-configuration
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: norish-secrets
                  key: oidc-client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: norish-secrets
                  key: oidc-client-secret
