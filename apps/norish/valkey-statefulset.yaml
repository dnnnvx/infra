apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: norish
  labels:
    app.kubernetes.io/part-of: norish
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/part-of: norish
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:9.1.2-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6379
              name: redis
          args:
            - --maxmemory
            - 128mb
            - --maxmemory-policy
            - noeviction
            - --appendonly
            - "yes"
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: norish
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: piraeus
        resources:
          requests:
            storage: 1Gi
