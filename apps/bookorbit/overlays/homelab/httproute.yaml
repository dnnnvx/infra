apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookorbit
  namespace: bookorbit
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: https
  hostnames:
    - books.casasulgorgo.net
  rules:
    - backendRefs:
        - name: bookorbit
          port: 3000
