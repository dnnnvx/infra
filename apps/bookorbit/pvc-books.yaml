apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookorbit-books
  namespace: bookorbit
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/part-of: bookorbit
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: piraeus
