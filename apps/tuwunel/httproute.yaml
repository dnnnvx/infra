apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tuwunel
  namespace: matrix
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |
      name: Matrix
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: https
  hostnames:
    - matrix.casasulgorgo.net
  rules:
    - backendRefs:
        - name: tuwunel
          port: 8008
      # /sync long-polls
      timeouts:
        request: 0s
---
# server_name is casasulgorgo.net: delegate client and federation discovery to matrix.casasulgorgo.net
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tuwunel-well-known
  namespace: matrix
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: https
  hostnames:
    - casasulgorgo.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/matrix
      backendRefs:
        - name: tuwunel
          port: 8008
