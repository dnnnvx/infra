apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: repos
  namespace: tangled
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: tangled
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssh-keys
  namespace: tangled
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi
