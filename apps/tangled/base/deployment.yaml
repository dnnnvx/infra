apiVersion: apps/v1
kind: Deployment
metadata:
  name: tangled
  namespace: tangled
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tangled
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tangled
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: knot
          image: tngl/knot:v1.12.0-alpha
          env:
            - name: KNOT_SERVER_DB_PATH
              value: /app/knotserver.db
            - name: KNOT_REPO_SCAN_PATH
              value: /home/git/repositories
            - name: KNOT_SERVER_INTERNAL_LISTEN_ADDR
              value: localhost:5444
            - name: KNOT_SERVER_LISTEN_ADDR
              value: 0.0.0.0:5555
            - name: APPVIEW_ENDPOINT
              value: https://tangled.org
            # set in overlay patch:
            # KNOT_SERVER_HOSTNAME, KNOT_SERVER_OWNER
          ports:
            - name: http
              containerPort: 5555
              protocol: TCP
            - name: ssh
              containerPort: 22
              protocol: TCP
          securityContext:
            # sshd requires privilege escalation for user switching
            allowPrivilegeEscalation: true
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          volumeMounts:
            - name: repos
              mountPath: /home/git/repositories
            - name: data
              mountPath: /app
            - name: ssh-keys
              mountPath: /etc/ssh/keys
      volumes:
        - name: repos
          persistentVolumeClaim:
            claimName: repos
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: ssh-keys
          persistentVolumeClaim:
            claimName: ssh-keys
