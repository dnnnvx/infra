apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ciliumnetworkpolicy.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - secrets.yaml
components:
  # Trigger, image automation, flux-sync RBAC; ci_project/ci_image come from clusters/production/apps/casasulgorgo.yaml
  - ../../components/ci-app
images:
  # The digest is a placeholder until the first build; Flux rewrites it.
  - name: casasulgorgo
    newName: registry.local.casasulgorgo.net/casasulgorgo/web
    newTag: production
    digest: sha256:cb63d1b6cdaeb2633c1ca0ee84ac26cc2c193815215202752d7749e46f13875d # {"$imagepolicy": "flux-system:casasulgorgo-web:digest"}
