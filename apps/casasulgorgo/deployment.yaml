apiVersion: apps/v1
kind: Deployment
metadata:
  name: casasulgorgo
  namespace: casasulgorgo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: casasulgorgo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: casasulgorgo
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: casasulgorgo
          # Registry + tag are set by the overlay (Flux image automation)
          image: casasulgorgo
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
          envFrom:
            # TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (same bot/chat as gatus)
            - secretRef:
                name: casasulgorgo-secrets
          env:
            # adapter-node sits behind the Gateway; needed for form-action CSRF checks
            - name: ORIGIN
              value: https://casasulgorgo.net
