apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: casasulgorgo
  namespace: casasulgorgo
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: https
  hostnames:
    - casasulgorgo.net
  rules:
    - backendRefs:
        - name: casasulgorgo
          port: 3000
