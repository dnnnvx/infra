apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - httproute.yaml
  - image-automation.yaml
  - ci-trigger.yaml
patches:
  - path: patch-deployment.yaml
images:
  # Pulled by containerd through the Talos registry mirror (tofu/production/main.tf).
  # The digest is a placeholder until the first build; Flux rewrites it.
  - name: casasulgorgo
    newName: zot.zot.svc.cluster.local:5000/casasulgorgo/web
    newTag: production
    digest: sha256:66bf8c45673e35b4187b1e7eaa8601b0ae95a19b98a479b941506bbd78c9a66a # {"$imagepolicy": "flux-system:casasulgorgo-web:digest"}
