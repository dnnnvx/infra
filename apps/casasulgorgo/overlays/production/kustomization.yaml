apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - httproute.yaml
  - image-automation.yaml
  - ci-trigger.yaml
patches:
  - path: patch-deployment.yaml
images:
  # Pulled by containerd through the Talos registry mirror (tofu/production/main.tf).
  # The digest is a placeholder until the first build; Flux rewrites it.
  - name: casasulgorgo
    newName: zot.zot.svc.cluster.local:5000/casasulgorgo/web
    newTag: production
    digest: sha256:5930389e7473a49c615d81c467869f618fa99c5fb6879d2f4d643eb485a123c9 # {"$imagepolicy": "flux-system:casasulgorgo-web:digest"}
