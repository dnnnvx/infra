apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - httproute.yaml
  - image-automation.yaml
patches:
  - path: patch-deployment.yaml
images:
  # Pulled by containerd through the Talos registry mirror (tofu/production/main.tf).
  # The digest is a placeholder until the first build; Flux rewrites it.
  - name: casasulgorgo
    newName: zot.zot.svc.cluster.local:5000/casasulgorgo/web
    newTag: production
    digest: sha256:a3bc5f5a99b16917c20476cd81cebcb1e0a99c97c5f6e1c6fdc516e40a7d0dce # {"$imagepolicy": "flux-system:casasulgorgo-web:digest"}
