apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - httproute.yaml
patches:
  - path: patch-deployment.yaml
images:
  # Pulled by containerd through the Talos registry mirror (tofu/production/main.tf).
  # The digest is a placeholder until the first build; Flux rewrites it.
  - name: casasulgorgo
    newName: zot.zot.svc.cluster.local:5000/casasulgorgo/web
    newTag: production
    digest: sha256:78ea6afa19caed5e6b903977b37ffdac1a53f21ade2c6aa42b0277cfd76d4c65 # {"$imagepolicy": "flux-system:casasulgorgo-web:digest"}
