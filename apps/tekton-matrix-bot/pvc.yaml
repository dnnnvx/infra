# store/: the SQLite state/crypto store, including the session (sealed under STORE_PASSPHRASE).
# Wiping it means a new login, i.e. a new device that can't decrypt what the old one received.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tekton-matrix-bot-data
  namespace: tekton-matrix-bot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: piraeus
