apiVersion: apps/v1
kind: Deployment
metadata:
  name: tekton-matrix-bot
  namespace: tekton-matrix-bot
  annotations:
    checkov.io/skip1: CKV_K8S_14=registry, tag and digest come from the kustomization images entry (Flux image automation)
    checkov.io/skip2: CKV_K8S_38=!ci, !tofu and the CI alerts read the cluster through the API (read-only, see rbac.yaml)
spec:
  replicas: 1
  # RWO volume, and two instances would fight over the same Matrix device
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tekton-matrix-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tekton-matrix-bot
    spec:
      serviceAccountName: tekton-matrix-bot
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tekton-matrix-bot
          # Registry + tag are set by the kustomization (Flux image automation)
          image: tekton-matrix-bot
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          envFrom:
            # MATRIX_PASSWORD (first login only), STORE_PASSPHRASE
            - secretRef:
                name: tekton-matrix-bot-secrets
          env:
            - name: MATRIX_HOMESERVER
              value: http://tuwunel.matrix.svc.cluster.local:8008
            - name: MATRIX_USER
              value: alerts
            - name: TEKTON_DASHBOARD_URL
              value: https://tekton.local.casasulgorgo.net
            - name: OPS_ROOM
              value: "!hcNOO-kFitB4fJ15jq8k5Ju5H56mGzLYXIIdbuhJvXM"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tekton-matrix-bot-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
