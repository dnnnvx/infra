# Read-only. !ci and the CI alerts need the PipelineRuns, !tofu needs the one Terraform
# and its stored plan. Approving a plan stays with a person running kubectl.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-matrix-bot
  namespace: tekton-matrix-bot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-matrix-bot-ci
  namespace: tekton-ci
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-matrix-bot-ci
  namespace: tekton-ci
subjects:
  - kind: ServiceAccount
    name: tekton-matrix-bot
    namespace: tekton-matrix-bot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-matrix-bot-ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-matrix-bot-tofu
  namespace: flux-system
rules:
  - apiGroups: ["infra.contrib.fluxcd.io"]
    resources: ["terraforms"]
    resourceNames: ["production"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["tfplan-default-production"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-matrix-bot-tofu
  namespace: flux-system
subjects:
  - kind: ServiceAccount
    name: tekton-matrix-bot
    namespace: tekton-matrix-bot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-matrix-bot-tofu
