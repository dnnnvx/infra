apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radicle-httpd
  namespace: radicle
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: https-marcods-sub
  hostnames:
    - rad.marcods.dev
  rules:
    - backendRefs:
        - name: radicle-httpd
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radicle-explorer
  namespace: radicle
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: https-marcods-sub
  hostnames:
    - git.marcods.dev
  rules:
    - backendRefs:
        - name: radicle-explorer
          port: 8080
