# Static web explorer; the browser calls radicle-httpd (rad.marcods.dev) directly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radicle-explorer
  namespace: radicle
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: radicle-explorer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radicle-explorer
        app.kubernetes.io/part-of: radicle
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: explorer
          image: ghcr.io/dnnnvx/radicle-explorer:0.30.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.json
              subPath: explorer.json
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
      volumes:
        - name: config
          configMap:
            name: radicle-explorer-config
        - name: tmp
          emptyDir: {}
