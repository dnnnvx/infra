apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ciliumnetworkpolicy.yaml
  - pvc.yaml
  - deployment-node.yaml
  - deployment-explorer.yaml
  - service.yaml
  - httproute.yaml
# Hashed names: editing config/ rolls the pods
configMapGenerator:
  - name: radicle-config
    namespace: radicle
    files:
      - config/config.json
      - config/repos
  - name: radicle-explorer-config
    namespace: radicle
    files:
      - config/explorer.json
