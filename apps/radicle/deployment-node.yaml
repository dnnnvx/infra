# radicle-node (P2P) + radicle-httpd (read-only JSON API), sharing RAD_HOME.
# P2P is LAN-only (radicle-p2p Service) until the router forwards 8776 and
# node.externalAddresses is set: until then the node only dials out to the public seeds.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radicle-node
  namespace: radicle
  annotations:
    checkov.io/skip1: CKV_K8S_14=registry, tag and digest come from the kustomization images entry (Flux image automation)
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: radicle-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radicle-node
        app.kubernetes.io/part-of: radicle
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # First start: create the node's own key (no passphrase). Every start: apply the
        # seeding policy for config/repos. Removing a line doesn't unseed (`rad unseed` by hand).
        - name: init
          image: radicle-node
          command:
            - sh
            - -euc
            - |
              [ -f "$RAD_HOME/keys/radicle" ] || echo | rad auth --alias marcods --stdin
              cp /config/config.json "$RAD_HOME/config.json"
              grep -v '^#' /config/repos | while read -r alias rid; do
                [ -n "$rid" ] && rad seed --no-fetch --scope all "$rid"
              done
              rad self --did
          env: &env
            - name: RAD_HOME
              value: /var/lib/radicle
            - name: HOME
              value: /tmp
          securityContext: &securityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts: &volumeMounts
            - name: data
              mountPath: /var/lib/radicle
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      containers:
        - name: node
          # Registry + tag are set by kustomization.yaml (Flux image automation)
          image: radicle-node
          # --force: a crashed node leaves its control socket behind on the PVC
          args: ["--force"]
          env: *env
          securityContext: *securityContext
          volumeMounts: *volumeMounts
          ports:
            - name: p2p
              containerPort: 8776
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: p2p
            initialDelaySeconds: 10
          readinessProbe:
            tcpSocket:
              port: p2p
        - name: httpd
          image: radicle-node
          command:
            - sh
            - -euc
            - |
              set -- --listen 0.0.0.0:8080
              while read -r alias rid; do
                case "$alias" in ''|'#'*) continue ;; esac
                set -- "$@" --alias "$alias" "$rid"
              done < /config/repos
              exec radicle-httpd "$@"
          env: *env
          securityContext: *securityContext
          volumeMounts: *volumeMounts
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/v1
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1
              port: http
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: config
          configMap:
            name: radicle-config
        - name: tmp
          emptyDir: {}
