apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: directus
  namespace: directus
spec:
  interval: 5m
  chart:
    spec:
      chart: directus
      version: ">=0.7.40"
      sourceRef:
        kind: HelmRepository
        name: directus
        namespace: directus
      interval: 1m
  values:
    replicaCount: 1
    admin:
      email: marco@ilposto.studio
      password: anubi@ilposto
    public:
      url: directus.ilposto.studio
    key: 1kd75mhf02n4jv8501mc1q09l24bca2
    secret: 1lc96nx0x6x9m8cv43m80xg2lw8vm93
    image:
      repository: directus/directus
      pullPolicy: Always
      tag: "10"
    service:
      type: ClusterIP
      port: 80
    persistence:
      enabled: false
      # existingClaim: ""
      # storageClass: "-"
      annotations: {}
      accessModes: ReadWriteOnce
      size: 8Gi
    ingress:
      enabled: false
      annotations: {}
        # kubernetes.io/ingress.class: nginx
        # kubernetes.io/tls-acme: "true"
      hosts:
        - host: directus.ilposto.studio
          paths:
            - path: /
              backend:
                serviceName: chart-example.local
                servicePort: 80
      tls: []
      #  - secretName: chart-example-tls
      #    hosts:
      #      - directus.ilposto.studio
    cache:
      enabled: true
      ttl: "5m"
      autoPurge: true
      store: "memory"
    generateEnvVars:
      mariadb: false
      redis: false
    extraEnvVars:
      # - name: STORAGE_LOCATIONS
      #   value: "s3"
      - name: DB_CLIENT
        value: "postgres"
      - name: DB_DATABASE
        value: "postgresql"
      - name: DB_USER
        value: "postgresql"
      - name: DB_PASSWORD
        value: "postgresql"
      - name: DB_HOST
        value: "postgresql.postgresql.svc.cluster.local"
      - name: DB_PORT
        value: "5432"
      - name: DB_SCHEMA
        value: "postgresql"
      - name: DB_CUSTOM_SCHEMA
        value: "postgresql"
      - name: DB_SEARCH_PATH
        value: "array:postgresql,public"
      - name: RATE_LIMITER_ENABLED
        value: "true"
      - name: RATE_LIMITER_POINTS # The amount of allowed hits per duration
        value: "50"
      - name: RATE_LIMITER_DURATION # The time window in seconds in which the points are counted
        value: "10"
      - name: RATE_LIMITER_STORE # Where to store the rate limiter counts. One of memory, redis
        value: "memory"
      - name: RATE_LIMITER_HEALTHCHECK_THRESHOLD # Healthcheck timeout threshold in ms
        value: "150"
      - name: RATE_LIMITER_GLOBAL_ENABLED	# Whether or not to enable global rate limiting on the API
        value: "false"
      - name: RATE_LIMITER_GLOBAL_POINTS	# The total amount of allowed hits per duration
        value: "1000"
      - name: RATE_LIMITER_GLOBAL_DURATION	# The time window in seconds in which the points are counted
        value: "1"
      - name: RATE_LIMITER_GLOBAL_HEALTHCHECK_THRESHOLD	# Healthcheck timeout threshold in ms
        value: "150"
      - name: RATE_LIMITER_GLOBAL_STORE	# Where to store the rate limiter counts. One of memory, redis
        value: "memory"
      - name: STORAGE_LOCATIONS
        value: "s3"
      - name: STORAGE_S3_DRIVER
        value: "s3"
      - name: STORAGE_S3_KEY
        value: "xV7u5IeqPsomv1DYxQPS6cKiT2Dy7PpxDrK7xpYA"
      - name: STORAGE_S3_SECRET
        value: "f2154efb561e80b6a8bac0b3018ce07a29973b1fad147ae52991c0396126a6e3"
      - name: STORAGE_S3_ENDPOINT
        value: "https://997f91bd76e7456df317ac9ac3fff92b.eu.r2.cloudflarestorage.com"
      - name: STORAGE_S3_BUCKET
        value: "directus"
      - name: STORAGE_S3_REGION
        value: "eu"
      - name: STORAGE_S3_ROOT
        value: "assets"
      - name: FILES_MAX_UPLOAD_SIZE
        value: "50mb"
      - name: FILES_MIME_TYPE_ALLOW_LIST
        value: "image/jepg,image/tiff,image/png,image/webp"
      - name: SYNCHRONIZATION_STORE
        value: "memory"
      - name: TELEMETRY
        value: "false"
      - name: EMAIL_TRANSPORT
        value: "sendmail"
      - name: EMAIL_FROM
        value: "no-reply@ilposto.studio"
    log:
      level: "info"
      style: "raw"
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 80m
        memory: 128Mi
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilizationPercentage: 80
      # targetMemoryUtilizationPercentage: 80
    startupProbe:
      enabled: true
    livenessProbe:
      enabled: true
    readinessProbe:
      enabled: true
    nodeSelector: {}
    tolerations: []
    affinity: {}
    mariadb:
      enabled: false
    redis:
      enabled: false
      architecture: standalone
