apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: cloudflare
spec:
  interval: 5m
  chart:
    spec:
      chart: cloudflared
      version: ">=1.1.0"
      sourceRef:
        kind: HelmRepository
        name: cloudflared
        namespace: cloudflare
      interval: 1m
  values:
    image:
      repository: cloudflare/cloudflared
      tag: "2024.2.0"
      imagePullPolicy: IfNotPresent
    replicaCount: 1
    managed:
      enabled: true
      existingSecret: cf-tunnel-token
