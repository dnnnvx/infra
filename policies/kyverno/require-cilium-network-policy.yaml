apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-cilium-network-policy
  annotations:
    policies.kyverno.io/title: Require CiliumNetworkPolicy
    policies.kyverno.io/description: >-
      Every namespace must have at least one CiliumNetworkPolicy.
      All policies live in policies/network/ — add one there and let Flux apply it.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-cilium-network-policy
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          - resources:
              names:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
      context:
        - name: cnpCount
          apiCall:
            urlPath: "/apis/cilium.io/v2/namespaces/{{request.object.metadata.name}}/ciliumnetworkpolicies"
            jmesPath: "items | length(@)"
      validate:
        message: >-
          Namespace {{ request.object.metadata.name }} has no CiliumNetworkPolicy.
          Add policies/network/{{ request.object.metadata.name }}.yaml and let Flux apply it.
        deny:
          conditions:
            all:
              - key: "{{ cnpCount }}"
                operator: LessThan
                value: "1"
