apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cert-manager-restrict-issuer
  annotations:
    policies.kyverno.io/title: Restrict Issuer
    policies.kyverno.io/category: Cert-Manager
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Certificates for casasulgorgo.net must use the letsencrypt-prod ClusterIssuer.
      This prevents creating certificates with an untrusted or self-signed issuer
      for the primary domain.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: restrict-casasulgorgo-issuer
      match:
        any:
          - resources:
              kinds:
                - Certificate
      validate:
        message: "Certificates for *.casasulgorgo.net must use the letsencrypt-prod ClusterIssuer."
        pattern:
          spec:
            (dnsNames): ["*.casasulgorgo.net | casasulgorgo.net"]
            issuerRef:
              name: letsencrypt-prod
              kind: ClusterIssuer
              group: cert-manager.io
