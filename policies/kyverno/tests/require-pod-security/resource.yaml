---
apiVersion: v1
kind: Pod
metadata:
  name: pod-compliant
  namespace: default
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: nginx:1.25.0
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        capabilities:
          drop: [ALL]
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-privileged
  namespace: default
spec:
  containers:
    - name: app
      image: nginx:1.25.0
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-privilege-escalation
  namespace: default
spec:
  containers:
    - name: app
      image: nginx:1.25.0
      securityContext:
        allowPrivilegeEscalation: true
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-root
  namespace: default
spec:
  containers:
    - name: app
      image: nginx:1.25.0
      securityContext:
        runAsNonRoot: false
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-runasuser-zero
  namespace: default
spec:
  containers:
    - name: app
      image: nginx:1.25.0
      securityContext:
        runAsUser: 0
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-no-drop
  namespace: default
spec:
  containers:
    - name: app
      image: nginx:1.25.0
      securityContext:
        allowPrivilegeEscalation: false
