apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-mutable-tags
policies:
  - ../../disallow-mutable-tags.yaml
resources:
  - resource.yaml
results:
  # require-image-tag rule
  - kind: Pod
    policy: disallow-mutable-tags
    rule: require-image-tag
    resources:
      - pod-no-tag
    result: fail
  - kind: Pod
    policy: disallow-mutable-tags
    rule: require-image-tag
    resources:
      - pod-versioned-tag
      - pod-digest
      - pod-mutable-tag
    result: pass
  # disallow-mutable-tag rule
  - kind: Pod
    policy: disallow-mutable-tags
    rule: disallow-mutable-tag
    resources:
      - pod-mutable-tag
    result: fail
  - kind: Pod
    policy: disallow-mutable-tags
    rule: disallow-mutable-tag
    resources:
      - pod-versioned-tag
      - pod-digest
    result: pass
