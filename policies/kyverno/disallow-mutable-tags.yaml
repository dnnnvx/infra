apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-mutable-tags
  annotations:
    policies.kyverno.io/title: Disallow Mutable Image Tags
    policies.kyverno.io/description: >-
      Images must use a specific version tag or digest.
      Mutable tags (latest, edge, stable, dev, master, main) and untagged images are rejected.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
      validate:
        message: "An image tag or digest is required."
        foreach:
          - list: "request.object.spec.initContainers"
            pattern:
              image: "*:* | *@*"
          - list: "request.object.spec.containers"
            pattern:
              image: "*:* | *@*"
          - list: "request.object.spec.ephemeralContainers"
            pattern:
              image: "*:* | *@*"

    - name: disallow-mutable-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
      validate:
        message: "Mutable image tags (latest, edge, stable, dev, master, main) are not allowed."
        foreach:
          - list: "request.object.spec.[ephemeralContainers, initContainers, containers][]"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:edge"
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:stable"
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:dev"
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:master"
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:main"
