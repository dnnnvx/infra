apiVersion: cli.kyverno.io/v1alpha1
kind: Values
metadata:
  name: values
policies:
  - name: require-cilium-network-policy
    resources:
      - name: ns-with-cnp
        values:
          cnpCount: 1
      - name: ns-without-cnp
        values:
          cnpCount: 0
      - name: kube-system
        values:
          cnpCount: 0
