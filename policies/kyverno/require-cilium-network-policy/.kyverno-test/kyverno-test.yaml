apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-cilium-network-policy
policies:
  - ../require-cilium-network-policy.yaml
resources:
  - resource.yaml
variables: values.yaml
results:
  - kind: Namespace
    policy: require-cilium-network-policy
    rule: check-cilium-network-policy
    resources:
      - ns-with-cnp
    result: pass
  - kind: Namespace
    policy: require-cilium-network-policy
    rule: check-cilium-network-policy
    resources:
      - ns-without-cnp
    result: fail
  - kind: Namespace
    policy: require-cilium-network-policy
    rule: check-cilium-network-policy
    resources:
      - kube-system
    result: skip
