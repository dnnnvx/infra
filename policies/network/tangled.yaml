apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
  namespace: tangled
spec:
  endpointSelector: {}
  ingress:
    # web UI via Cilium Gateway
    - fromEntities:
        - ingress
    # git push/pull over SSH from the internet
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
    # gatus monitoring
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: gatus
      toPorts:
        - ports:
            - port: "5555"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # tangled.org appview (federation) + any external git operations
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
