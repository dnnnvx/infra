# Generates ResourceQuota (1 CPU / 4Gi) and LimitRange per new namespace
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-bp-add-ns-quota
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: kyverno-policies
    namespace: flux-system
  path: ./best-practices/add-ns-quota
  prune: true
  wait: false
  dependsOn:
    - name: infrastructure
  patches:
    - patch: |-
        - op: replace
          path: /spec/rules/0/generate/data/spec/hard/requests.cpu
          value: "1"
        - op: replace
          path: /spec/rules/0/generate/data/spec/hard/limits.cpu
          value: "1"
        - op: replace
          path: /spec/rules/0/generate/data/spec/hard/requests.memory
          value: 4Gi
        - op: replace
          path: /spec/rules/0/generate/data/spec/hard/limits.memory
          value: 4Gi
      target:
        kind: ClusterPolicy
        name: add-ns-quota
