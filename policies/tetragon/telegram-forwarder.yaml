apiVersion: v1
kind: ConfigMap
metadata:
  name: tetragon-telegram-forwarder
  namespace: kube-system
data:
  forward.sh: |
    #!/bin/sh
    set -eu

    API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

    log() { echo "[$(date -u +%H:%M:%S)] $*"; }

    send() {
      log "Sending alert to Telegram: $1"
      if curl -sf -X POST "$API" \
        -H "Content-Type: application/json" \
        -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"parse_mode\":\"HTML\",\"text\":\"$1\"}" \
        > /dev/null; then
        log "Sent OK"
      else
        log "ERROR: curl failed (exit $?)"
      fi
    }

    EXPORT_FILE="/var/run/cilium/tetragon/tetragon.log"

    log "Starting tetragon-telegram-forwarder"
    log "Waiting for export file: $EXPORT_FILE"
    while [ ! -f "$EXPORT_FILE" ]; do sleep 2; done
    log "Tailing $EXPORT_FILE"

    tail -F "$EXPORT_FILE" | while IFS= read -r line; do
      # Only process TracingPolicy hits
      echo "$line" | jq -e '.process_kprobe != null' > /dev/null 2>&1 || continue

      policy=$(echo "$line"  | jq -r '.process_kprobe.policy_name // "unknown"')
      func=$(echo "$line"    | jq -r '.process_kprobe.function_name // "unknown"')
      binary=$(echo "$line"  | jq -r '.process_kprobe.process.binary // "?"')
      pargs=$(echo "$line"   | jq -r '.process_kprobe.process.arguments // ""')
      uid=$(echo "$line"     | jq -r '.process_kprobe.process.uid // "?"')
      pod=$(echo "$line"     | jq -r '.process_kprobe.process.pod.name // "host"')
      ns=$(echo "$line"      | jq -r '.process_kprobe.process.pod.namespace // "host"')
      node=$(echo "$line"    | jq -r '.node_name // "?"')
      parent=$(echo "$line"  | jq -r '.process_kprobe.parent.binary // ""')
      args=$(echo "$line"    | jq -r '[.process_kprobe.args[]?.value // ""] | join(" ")' 2>/dev/null || echo "")

      log "Event: policy=${policy} fn=${func} binary=${binary} pod=${pod}/${ns} node=${node}"

      msg="&#x1F6A8; <b>Tetragon</b> [${node}]
      Policy: <code>${policy}</code>
      Fn: <code>${func}</code>
      Binary: <code>${binary}${pargs:+ ${pargs}}</code>
      UID: <code>${uid}</code>
      Pod: <code>${pod}</code> / <code>${ns}</code>${parent:+
      Parent: <code>${parent}</code>}${args:+
      Args: <code>${args}</code>}"

      send "$msg"
    done
