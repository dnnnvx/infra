# Fires only when a process explicitly calls setuid(0) — i.e. asks to become root.
# Much more targeted than commit_creds which fires on every credential change.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: root-escalation
spec:
  kprobes:
    - call: "sys_setuid"
      syscall: true
      args:
        - index: 0
          type: "int"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Equal"
              values:
                - "0"
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - "host_ns"
          matchActions:
            - action: Post
