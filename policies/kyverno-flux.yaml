apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-flux
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: kyverno-policies
    namespace: flux-system
  path: ./flux
  prune: true
  wait: false
  dependsOn:
    - name: infrastructure
  patches:
    # Multi-tenant setup only
    - patch: |-
        $patch: delete
        apiVersion: kyverno.io/v1
        kind: ClusterPolicy
        metadata:
          name: generate-flux-multi-tenant-resources
      target:
        kind: ClusterPolicy
        name: generate-flux-multi-tenant-resources
    # Replaced by our customized version in policies/kyverno/
    - patch: |-
        $patch: delete
        apiVersion: kyverno.io/v1
        kind: ClusterPolicy
        metadata:
          name: verify-flux-sources
      target:
        kind: ClusterPolicy
        name: verify-flux-sources
