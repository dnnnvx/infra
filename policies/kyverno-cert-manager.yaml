apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-cm-limit-duration
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: kyverno-policies
    namespace: flux-system
  path: ./cert-manager/cert-manager-limit-duration
  prune: true
  wait: false
  dependsOn:
    - name: infrastructure
