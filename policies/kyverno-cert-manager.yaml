apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-cert-manager
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: kyverno-policies
    namespace: flux-system
  path: ./cert-manager
  prune: true
  wait: false
  dependsOn:
    - name: infrastructure
  patches:
    # Too restrictive — most certs have multiple SANs
    - patch: |-
        $patch: delete
        apiVersion: kyverno.io/v1
        kind: ClusterPolicy
        metadata:
          name: cert-manager-limit-dnsnames
      target:
        kind: ClusterPolicy
        name: cert-manager-limit-dnsnames
    # Replaced by our customized version in policies/kyverno/
    - patch: |-
        $patch: delete
        apiVersion: kyverno.io/v1
        kind: ClusterPolicy
        metadata:
          name: cert-manager-restrict-issuer
      target:
        kind: ClusterPolicy
        name: cert-manager-restrict-issuer
